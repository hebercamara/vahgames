<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Corrida</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2d3748; /* Slightly lighter dark background */
            border-radius: 1rem; /* Rounded corners */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            color: #e2e8f0; /* Light text color */
            width: 100%;
            max-width: 600px; /* Reduced max-width for the game container */
            margin: 1rem;
        }
        canvas {
            background-color: #333; /* Road color */
            border-radius: 0.5rem;
            display: block;
            width: 100%; /* Responsive width */
            max-width: 500px; /* Reduced max-width for the canvas */
            height: 600px; /* Reduced height for the canvas */
            margin-bottom: 1rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .game-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.125rem; /* text-lg */
            font-weight: bold;
            color: #a0aec0; /* Gray text */
        }
        .game-controls button {
            background-color: #4299e1; /* Blue */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem; /* Rounded corners */
            font-size: 1.125rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .game-controls button:hover {
            background-color: #3182ce; /* Darker blue */
            transform: translateY(-2px);
        }
        .game-controls button:active {
            transform: translateY(0);
        }
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            display: none; /* Hidden by default */
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            flex-direction: column; /* To stack buttons */
            gap: 1rem; /* Space between buttons */
        }
        .message-box button {
            margin-top: 0; /* Reset margin from general button style */
            background-color: #48bb78; /* Green */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }
        .message-box button:hover {
            background-color: #38a169; /* Darker green */
        }
        .ranking-container {
            margin-top: 1.5rem;
            width: 100%;
            max-height: 250px; /* Limit height for scrolling */
            overflow-y: auto; /* Enable vertical scrolling */
            background-color: #2d3748;
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3);
        }
        .ranking-container h2 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #a0aec0;
            margin-bottom: 1rem;
            text-align: center;
        }
        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .ranking-list li {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #4a5568; /* Darker gray border */
            color: #e2e8f0;
        }
        .ranking-list li:last-child {
            border-bottom: none;
        }
        .ranking-list li span:first-child {
            font-weight: bold;
            color: #63b3ed; /* Light blue for names */
        }
        .ranking-list li span:last-child {
            color: #f6e05e; /* Yellow for scores */
        }
        .user-id-display {
            margin-top: 1rem;
            font-size: 0.875rem; /* text-sm */
            color: #a0aec0;
            text-align: center;
            word-break: break-all; /* Break long IDs */
            padding: 0.5rem;
            background-color: #242c38;
            border-radius: 0.5rem;
        }

        /* Styles for main menu and shop screen */
        .menu-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 101;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 80%;
            max-width: 600px;
        }
        .menu-screen h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #f6e05e;
        }
        .menu-screen button {
            background-color: #4299e1;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1.125rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .menu-screen button:hover:not(:disabled) {
            background-color: #3182ce;
            transform: translateY(-2px);
        }
        .menu-screen button:disabled {
            background-color: #718096;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .trophy-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem; /* Large trophy icon */
            color: #f6e05e; /* Gold color */
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.7);
            display: none; /* Hidden by default */
            z-index: 102; /* Above everything */
            animation: popIn 0.5s ease-out forwards;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* Menu content layout */
        .menu-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        @media (min-width: 640px) {
            .menu-content {
                flex-direction: row;
                align-items: flex-start;
            }
        }
        .menu-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .menu-section h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        #carSelection .car-option, #carShop .car-option {
            border: 2px solid transparent;
            border-radius: 0.5rem;
            transition: border-color 0.2s ease;
            padding: 5px;
            background-color: #4a5568;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        #carSelection .car-option.selected {
            border-color: #f6e05e;
        }
        #carShop .car-option.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #carSelection img, #carShop img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .car-price {
            font-size: 0.9rem;
            color: #f6e05e;
            margin-top: 0.25rem;
        }

        /* Shop specific styles */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); /* Responsive grid for cars */
            gap: 1rem;
            width: 100%;
            max-height: 300px; /* Limit height for scrolling if many cars */
            overflow-y: auto;
            padding: 1rem;
            background-color: #2d3748;
            border-radius: 0.5rem;
        }
        .shop-grid .car-option {
            min-width: 100px; /* Ensure a minimum width for car options */
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="text-3xl font-bold mb-4 text-white">Jogo de Corrida</h1>
        <div class="game-info">
            <span>Pontuação: <span id="score">0</span></span>
            <span>Fase: <span id="phaseDisplay">1</span></span>
            <span>Recorde: <span id="highScore">0</span></span>
            <span>Troféus: <span id="trophyCount">0</span></span> <!-- New trophy count display -->
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="game-controls">
            <button id="startButton">Iniciar Jogo</button>
        </div>
        <div class="user-id-display">
            Seu ID de Usuário: <span id="userIdDisplay">Carregando...</span>
        </div>
        <div class="ranking-container">
            <h2>Ranking</h2>
            <ul id="rankingList" class="ranking-list">
                <!-- Ranking items will be inserted here by JavaScript -->
                <li><span>Carregando Ranking...</span><span></span></li>
            </ul>
        </div>
    </div>

    <!-- Message Box for Game Over/Start -->
    <div id="messageBox" class="message-box">
        <p id="messageText"></p>
        <button id="messageButton1"></button> <!-- First button -->
        <button id="messageButton2"></button> <!-- Second button -->
    </div>

    <!-- Start Menu -->
    <div id="startMenu" class="menu-screen">
        <h2>Bem-vindo ao Jogo de Corrida!</h2>
        <div class="menu-content">
            <div class="menu-section">
                <h2>Selecione a Fase</h2>
                <div id="phaseButtons" class="flex flex-col gap-2">
                    <!-- Phase buttons will be generated here -->
                </div>
            </div>
            <div class="menu-section">
                <h2>Selecione seu Carro</h2>
                <div id="carSelection" class="flex flex-wrap justify-center gap-4">
                    <!-- Car images/buttons will be generated here -->
                </div>
                <button id="goToShopButton" class="mt-4">Loja de Carros</button>
            </div>
        </div>
    </div>

    <!-- Car Shop Screen -->
    <div id="shopScreen" class="menu-screen" style="display: none;">
        <h2>Loja de Carros</h2>
        <div id="carShop" class="shop-grid">
            <!-- Shop cars will be generated here -->
        </div>
        <button id="backToMenuFromShop" class="mt-4">Voltar ao Menu Principal</button>
    </div>

    <!-- Trophy Display (for phase completion) -->
    <div id="trophyDisplay" class="trophy-display">🏆</div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables for Firebase
        let app = null;
        let db = null;
        let auth = null;
        let userId = 'anonymous';

        // Firestore collection paths
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const getScoresCollectionRef = () => {
            if (!db || !userId) return null;
            return collection(db, `artifacts/${appId}/public/data/scores`);
        };

        // Game variables
        const canvas = document.getElementById('gameCanvas');
        // Set internal resolution to match design intent
        canvas.width = 500;
        canvas.height = 600;
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const startButton = document.getElementById('startButton');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const messageButton1 = document.getElementById('messageButton1');
        const messageButton2 = document.getElementById('messageButton2');
        const rankingList = document.getElementById('rankingList');
        const userIdDisplay = document.getElementById('userIdDisplay');
        const phaseDisplay = document.getElementById('phaseDisplay');
        const trophyCountDisplay = document.getElementById('trophyCount');
        const startMenu = document.getElementById('startMenu');
        const shopScreen = document.getElementById('shopScreen');
        const phaseButtonsContainer = document.getElementById('phaseButtons');
        const carSelectionContainer = document.getElementById('carSelection');
        const carShopContainer = document.getElementById('carShop');
        const goToShopButton = document.getElementById('goToShopButton');
        const backToMenuFromShopButton = document.getElementById('backToMenuFromShop');
        const trophyDisplay = document.getElementById('trophyDisplay');

        let playerCar = null;
        let opponentCars = [];
        let backgroundElements = [];
        let score = 0;
        let highScore = 0;
        let trophiesCollected = 0;
        let highestPhaseCompleted = 0;
        let gameRunning = false;
        let animationFrameId = null;
        let roadSpeed = 2;
        let opponentSpawnInterval = 3500;
        let lastOpponentSpawnTime = 0;
        let currentPhase = 1;
        let phaseStartTime = 0;
        let backgroundSpawnInterval = 500;
        let lastBackgroundSpawnTime = 0;
        let phaseDuration = 0;

        // Phase configurations
        const phases = [
            { speed: 2, spawnInterval: 3500, duration: 30000, trophyReward: 5 }, // Phase 1
            { speed: 3, spawnInterval: 3000, duration: 30000, trophyReward: 7 }, // Phase 2
            { speed: 4, spawnInterval: 2500, duration: 30000, trophyReward: 10 }, // Phase 3
            { speed: 5, spawnInterval: 2000, duration: 30000, trophyReward: 12 }, // Phase 4
            { speed: 6, spawnInterval: 1500, duration: 30000, trophyReward: 15 }, // Phase 5
            { speed: 7, spawnInterval: 1200, duration: 30000, trophyReward: 18 }, // Phase 6
            { speed: 8, spawnInterval: 900, duration: 30000, trophyReward: 20 }, // Phase 7
            { speed: 9, spawnInterval: 700, duration: 30000, trophyReward: 25 }, // Phase 8
            { speed: 10, spawnInterval: 500, duration: 30000, trophyReward: 30 }, // Phase 9
            { speed: 11, spawnInterval: 300, duration: 30000, trophyReward: 40 }, // Phase 10
        ];

        // Car properties
        const carWidth = 60;
        const carHeight = 60;

        // All available player cars (default and shop)
        const allPlayerCars = [
            // Default cars (owned initially)
            { id: 'car_sport_red_default', name: 'Esportivo Vermelho', imageUrl: 'https://i.postimg.cc/SRt7mXGX/Prancheta-2-c-pia-2.png', cost: 0 },
            { id: 'car_truck_blue_default', name: 'Caminhonete Azul', imageUrl: 'https://i.postimg.cc/fy5qmTfZ/Caminhonete-Azul.png', cost: 0 },
            { id: 'car_f1_yellow_default', name: 'Fórmula 1 Amarela', imageUrl: 'https://i.postimg.cc/SsfgbN58/F-rmula-1-amar.png', cost: 0 },

            // Shop cars (newly added)
            { id: 'car_truck_green', name: 'Caminhonete Verde', imageUrl: 'https://i.postimg.cc/65j1QqQf/Caminhonete-Verde.png', cost: 15 },
            { id: 'car_truck_red', name: 'Caminhonete Vermelha', imageUrl: 'https://i.postimg.cc/vHHNMfGm/Caminhonete-Verm.png', cost: 20 },
            { id: 'car_sport_blue', name: 'Esportivo Azul', imageUrl: 'https://i.postimg.cc/v8vNp3Fj/Esporte-Azul.png', cost: 25 },
            { id: 'car_sport_orange', name: 'Esportivo Laranja', imageUrl: 'https://i.postimg.cc/jSD3nTw0/Esporte-Laranja.png', cost: 30 },
            { id: 'car_sport_purple', name: 'Esportivo Roxo', imageUrl: 'https://i.postimg.cc/FHwWj63f/Esporte-Roxo.png', cost: 35 },
            { id: 'car_sport_green', name: 'Esportivo Verde', imageUrl: 'https://i.postimg.cc/GpYMzjxX/Esporte-Verde.png', cost: 40 },
            { id: 'car_f1_purple', name: 'Fórmula 1 Roxa', imageUrl: 'https://i.postimg.cc/SsfgbN58/F-rmula-1-roxo.png', cost: 45 },
            { id: 'car_f1_green', name: 'Fórmula 1 Verde', imageUrl: 'https://i.postimg.cc/HnS3jvTk/F-rmula-1-verde.png', cost: 50 },
            { id: 'car_f1_red', name: 'Fórmula 1 Vermelha', imageUrl: 'https://i.postimg.cc/FFGTPz0X/F-rmula-1-verm.png', cost: 55 },
            { id: 'car_rocket', name: 'Foguete', imageUrl: 'https://i.postimg.cc/vBs0K6Pb/Foguete.png', cost: 100 },
            { id: 'car_superman', name: 'Superman', imageUrl: 'https://i.postimg.cc/Y2Xx6Vwp/Superman.png', cost: 150 }
        ];

        let ownedPlayerCarIds = ['car_sport_red_default', 'car_truck_blue_default', 'car_f1_yellow_default'];
        let selectedPlayerCarId = 'car_sport_red_default';

        // Opponent car images (only these will appear as enemies)
        const opponentCarImageUrls = [
            'https://i.postimg.cc/TYwCBxcL/Padr-o-Amarelo.png',
            'https://i.postimg.cc/5NRnVrPP/Padr-o-Azul.png',
            'https://i.postimg.cc/2SLT8xMC/Padr-o-Ciano.png',
            'https://i.postimg.cc/7Lv9C2r0/Padr-o-Laranja.png',
            'https://i.postimg.cc/tgh5F49f/Padr-o-rosa.png',
            'https://i.postimg.cc/sXsJmCX2/Padr-o-Roxo.png'
        ];

        // Road properties
        const roadLineColor = '#a0aec0';
        const roadLineWidth = 8;
        const roadLineLength = 40;
        const roadLineGap = 60;
        let roadLineOffset = 0;

        // Grass properties
        const grassColor = '#48bb78';
        let grassOffset = 0;

        // Lane system
        const numLanes = 5;
        let lanePositions = [];
        let currentLane = Math.floor(numLanes / 2);

        // Function to calculate lane positions
        function calculateLanePositions() {
            lanePositions = [];
            const laneWidth = canvas.width / numLanes;
            for (let i = 0; i < numLanes; i++) {
                lanePositions.push(i * laneWidth + (laneWidth / 2) - (carWidth / 2));
            }
        }

        // Player Car Object
        class Car {
            constructor(x, y, imageUrl) {
                this.x = x;
                this.y = y;
                this.width = carWidth;
                this.height = carHeight;
                this.imageUrl = imageUrl;
                this.carImage = new Image();
                this.isImageLoaded = false;

                this.carImage.onload = () => {
                    this.isImageLoaded = true;
                };
                this.carImage.onerror = () => {
                    console.error(`Failed to load image: ${this.imageUrl}`);
                    this.isImageLoaded = false;
                };
                this.carImage.src = this.imageUrl;
            }

            draw() {
                const c = ctx;
                const x = this.x;
                const y = this.y;
                const w = this.width;
                const h = this.height;

                if (this.isImageLoaded) {
                    c.drawImage(this.carImage, x, y, w, h);
                } else {
                    // Fallback to a simple colored square if image is not loaded
                    c.fillStyle = '#63b3ed';
                    c.fillRect(x, y, w, h);
                }
            }

            update() {
                this.y += roadSpeed;
            }
        }

        class BackgroundElement {
            constructor(x, y, width, height, type) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type;
            }

            draw() {
                const c = ctx;
                const x = this.x;
                const y = this.y;
                const w = this.width;
                const h = this.height;

                if (this.type === 'tree') {
                    c.fillStyle = '#2f855a';
                    c.fillRect(x, y, w, h * 0.7);
                    c.fillStyle = '#8b4513';
                    c.fillRect(x + w * 0.3, y + h * 0.7, w * 0.4, h * 0.3);
                } else if (this.type === 'building') {
                    c.fillStyle = '#718096';
                    c.fillRect(x, y, w, h);
                    c.fillStyle = '#cbd5e0';
                    c.fillRect(x + w * 0.1, y + h * 0.1, w * 0.2, h * 0.1);
                    c.fillRect(x + w * 0.7, y + h * 0.1, w * 0.2, h * 0.1);
                    c.fillRect(x + w * 0.1, y + h * 0.3, w * 0.2, h * 0.1);
                    c.fillRect(x + w * 0.7, y + h * 0.3, w * 0.2, h * 0.1);
                }
            }

            update() {
                this.y += roadSpeed;
            }
        }

        function drawGrass() {
            ctx.fillStyle = grassColor;
            const roadWidth = canvas.width / numLanes * numLanes;
            const roadLeft = (canvas.width - roadWidth) / 2;
            const roadRight = roadLeft + roadWidth;

            ctx.fillRect(0, 0, roadLeft, canvas.height);
            ctx.fillRect(roadRight, 0, canvas.width - roadRight, canvas.height);

            ctx.fillStyle = '#38a169';
            for (let i = 0; i < canvas.height / 20; i++) {
                let y = (i * 20 + grassOffset) % (canvas.height + 20);
                if (y < -20) y += canvas.height + 20;

                ctx.fillRect(Math.random() * (roadLeft - 10), y, 5, 10);
                ctx.fillRect(roadRight + 5 + Math.random() * (canvas.width - roadRight - 15), y, 5, 10);
            }
            grassOffset = (grassOffset + roadSpeed) % 20;
        }

        function drawRoad() {
            ctx.fillStyle = roadLineColor;
            for (let i = 0; i < canvas.height / (roadLineLength + roadLineGap); i++) {
                let y = (i * (roadLineLength + roadLineGap) + roadLineOffset) % (canvas.height + roadLineGap);
                if (y < -roadLineLength) y += canvas.height + roadLineGap;

                ctx.fillRect(canvas.width / 2 - roadLineWidth / 2, y, roadLineWidth, roadLineLength);

                const laneWidth = canvas.width / numLanes;
                for (let j = 1; j < numLanes; j++) {
                    ctx.fillRect(j * laneWidth - roadLineWidth / 2, y, roadLineWidth, roadLineLength);
                }
            }
            roadLineOffset = (roadLineOffset + roadSpeed) % (roadLineLength + roadLineGap);
        }

        function spawnOpponentCar() {
            const lane = Math.floor(Math.random() * numLanes);
            const x = lanePositions[lane];
            const imageUrl = opponentCarImageUrls[Math.floor(Math.random() * opponentCarImageUrls.length)];
            opponentCars.push(new Car(x, -carHeight, imageUrl));
        }

        function spawnBackgroundElement() {
            const side = Math.random() < 0.5 ? 'left' : 'right';
            let x;
            const y = -100;
            const type = Math.random();

            const roadLeftEdge = (canvas.width / 2) - (numLanes / 2) * (canvas.width / numLanes);
            const roadRightEdge = (canvas.width / 2) + (numLanes / 2) * (canvas.width / numLanes);

            if (side === 'left') {
                x = Math.random() * (roadLeftEdge - 20) ;
            } else {
                x = roadRightEdge + 20 + Math.random() * (canvas.width - roadRightEdge - 20 - 50);
            }

            if (type < 0.7) {
                const treeWidth = 20 + Math.random() * 15;
                const treeHeight = 40 + Math.random() * 30;
                backgroundElements.push(new BackgroundElement(x, y, treeWidth, treeHeight, 'tree'));
            } else {
                const buildingWidth = 30 + Math.random() * 40;
                const buildingHeight = 50 + Math.random() * 60;
                backgroundElements.push(new BackgroundElement(x, y, buildingWidth, buildingHeight, 'building'));
            }
        }

        function drawBackground() {
            for (let i = 0; i < backgroundElements.length; i++) {
                backgroundElements[i].draw();
            }
        }

        function updateBackgroundElements() {
            for (let i = 0; i < backgroundElements.length; i++) {
                backgroundElements[i].update();
            }
            backgroundElements = backgroundElements.filter(el => el.y < canvas.height + el.height);
        }

        function checkCollision(car1, car2) {
            return car1.x < car2.x + car2.width &&
                   car1.x + car1.width > car2.x &&
                   car1.y < car2.y + car2.height &&
                   car1.y + car1.height > car2.y;
        }

        // Game State Management
        let gameState = 'menu'; // 'menu', 'playing', 'gameOver', 'phaseComplete', 'shop'

        function showMenu() {
            gameState = 'menu';
            startMenu.style.display = 'flex';
            shopScreen.style.display = 'none'; // Hide shop screen
            canvas.style.display = 'none';
            startButton.style.display = 'none';
            messageBox.style.display = 'none';
            generatePhaseButtons();
            generateCarSelection();
        }

        function showShop() {
            gameState = 'shop';
            startMenu.style.display = 'none'; // Hide main menu
            shopScreen.style.display = 'flex'; // Show shop screen
            canvas.style.display = 'none';
            startButton.style.display = 'none';
            messageBox.style.display = 'none';
            generateCarShop(); // Generate shop items
        }

        function startGame(phaseIndex) {
            gameState = 'playing';
            startMenu.style.display = 'none';
            shopScreen.style.display = 'none'; // Hide shop screen
            canvas.style.display = 'block';
            startButton.style.display = 'none';
            messageBox.style.display = 'none';

            currentPhase = phaseIndex + 1;
            const selectedPhase = phases[phaseIndex];
            roadSpeed = selectedPhase.speed;
            opponentSpawnInterval = selectedPhase.spawnInterval;
            phaseDuration = selectedPhase.duration;

            score = 0;
            scoreDisplay.textContent = score;
            phaseDisplay.textContent = currentPhase;
            lastOpponentSpawnTime = 0;
            phaseStartTime = 0;
            backgroundSpawnInterval = 500;
            lastBackgroundSpawnTime = 0;
            opponentCars = [];
            backgroundElements = [];
            currentLane = Math.floor(numLanes / 2);
            const selectedCar = allPlayerCars.find(car => car.id === selectedPlayerCarId);
            playerCar = new Car(lanePositions[currentLane], canvas.height - carHeight - 10, selectedCar.imageUrl);
            gameLoop(0);
        }

        function endGame() {
            gameState = 'gameOver';
            cancelAnimationFrame(animationFrameId);
            showMessage(
                'Fim de Jogo! Sua pontuação: ' + Math.floor(score),
                'Tentar Novamente', () => startGame(currentPhase - 1),
                'Voltar ao Menu', showMenu
            );
            saveGameData();
        }

        function completePhase() {
            gameState = 'phaseComplete';
            cancelAnimationFrame(animationFrameId);
            trophiesCollected += phases[currentPhase - 1].trophyReward;
            trophyCountDisplay.textContent = trophiesCollected;

            if (currentPhase > highestPhaseCompleted) {
                highestPhaseCompleted = currentPhase;
            }
            saveGameData();

            trophyDisplay.style.display = 'block';
            setTimeout(() => {
                trophyDisplay.style.display = 'none';

                let button1Text, button1Action;
                let button2Text = 'Voltar ao Menu', button2Action = showMenu;

                if (currentPhase < phases.length) {
                    button1Text = `Próxima Fase (${currentPhase + 1})`;
                    button1Action = () => startGame(currentPhase);
                } else {
                    button1Text = 'Parabéns! Todas as Fases Completas!';
                    button1Action = showMenu;
                    button2Text = null;
                    button2Action = null;
                }
                showMessage(`Fase ${currentPhase} Completa!`, button1Text, button1Action, button2Text, button2Action);

            }, 1500);
        }

        function showMessage(text, button1Text, button1Action, button2Text = null, button2Action = null) {
            messageText.textContent = text;
            messageButton1.textContent = button1Text;
            messageButton1.onclick = button1Action;
            messageBox.style.display = 'flex';

            if (button2Text && button2Action) {
                messageButton2.style.display = 'block';
                messageButton2.textContent = button2Text;
                messageButton2.onclick = button2Action;
            } else {
                messageButton2.style.display = 'none';
            }
        }

        function hideMessageBox() {
            messageBox.style.display = 'none';
        }

        function generatePhaseButtons() {
            phaseButtonsContainer.innerHTML = '';
            phases.forEach((phase, index) => {
                const button = document.createElement('button');
                button.textContent = `Fase ${index + 1}`;
                button.dataset.phaseIndex = index;
                button.onclick = () => startGame(index);

                if (index > highestPhaseCompleted) {
                    button.disabled = true;
                }
                phaseButtonsContainer.appendChild(button);
            });
        }

        function generateCarSelection() {
            carSelectionContainer.innerHTML = '';
            allPlayerCars.filter(car => ownedPlayerCarIds.includes(car.id)).forEach((car) => {
                const carDiv = document.createElement('div');
                carDiv.className = 'car-option flex flex-col items-center cursor-pointer p-2 rounded-lg transition-all duration-200';
                if (car.id === selectedPlayerCarId) {
                    carDiv.classList.add('selected');
                } else {
                    carDiv.classList.remove('selected');
                }

                const carImage = document.createElement('img');
                carImage.src = car.imageUrl;
                carImage.alt = car.name;
                carImage.width = carWidth;
                carImage.height = carHeight;
                carImage.className = 'rounded-md';

                const carName = document.createElement('span');
                carName.textContent = car.name;
                carName.className = 'text-sm mt-1';

                carDiv.appendChild(carImage);
                carDiv.appendChild(carName);

                carDiv.onclick = () => {
                    selectedPlayerCarId = car.id;
                    generateCarSelection();
                };

                carSelectionContainer.appendChild(carDiv);
            });
        }

        function generateCarShop() {
            carShopContainer.innerHTML = '';
            allPlayerCars.filter(car => !ownedPlayerCarIds.includes(car.id)).forEach((car) => {
                const carDiv = document.createElement('div');
                carDiv.className = 'car-option flex flex-col items-center cursor-pointer p-2 rounded-lg transition-all duration-200';

                const carImage = document.createElement('img');
                carImage.src = car.imageUrl;
                carImage.alt = car.name;
                carImage.width = carWidth;
                carImage.height = carHeight;
                carImage.className = 'rounded-md';

                const carName = document.createElement('span');
                carName.textContent = car.name;
                carName.className = 'text-sm mt-1';

                const carPrice = document.createElement('span');
                carPrice.className = 'car-price';
                carPrice.textContent = `Troféus: ${car.cost} 🏆`;

                carDiv.appendChild(carImage);
                carDiv.appendChild(carName);
                carDiv.appendChild(carPrice);

                if (trophiesCollected >= car.cost) {
                    carDiv.onclick = () => purchaseCar(car.id, car.cost);
                } else {
                    carDiv.classList.add('locked');
                }

                carShopContainer.appendChild(carDiv);
            });
            if (carShopContainer.innerHTML === '') {
                carShopContainer.innerHTML = '<p class="text-gray-400">Todos os carros comprados!</p>';
            }
        }

        function purchaseCar(carId, cost) {
            if (trophiesCollected >= cost) {
                trophiesCollected -= cost;
                ownedPlayerCarIds.push(carId);
                trophyCountDisplay.textContent = trophiesCollected;
                saveGameData();
                generateCarSelection();
                generateCarShop();
                showMessage(`Você comprou o carro!`, 'Ótimo!', hideMessageBox);
            } else {
                showMessage(`Você não tem troféus suficientes para comprar este carro!`, 'Ok', hideMessageBox);
            }
        }

        // Mouse/Touch control handlers
        function handleCanvasClick(e) {
            if (gameState !== 'playing') return;

            const rect = canvas.getBoundingClientRect();
            // Calculate scale factor in case canvas is resized via CSS
            const scaleX = canvas.width / rect.width;
            
            const clickX = (e.clientX - rect.left) * scaleX; // Get X relative to canvas internal resolution

            if (clickX < canvas.width / 2) { // Clicked on left half
                currentLane = Math.max(0, currentLane - 1);
            } else { // Clicked on right half
                currentLane = Math.min(numLanes - 1, currentLane + 1);
            }
        }

        // Main game loop
        function gameLoop(currentTime) {
            if (gameState !== 'playing') return;

            if (phaseStartTime === 0) {
                phaseStartTime = currentTime;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrass();
            if (currentTime - lastBackgroundSpawnTime > backgroundSpawnInterval) {
                spawnBackgroundElement();
                lastBackgroundSpawnTime = currentTime;
            }
            updateBackgroundElements();
            drawBackground();
            drawRoad();

            playerCar.x = lanePositions[currentLane];
            playerCar.draw();

            if (currentTime - lastOpponentSpawnTime > opponentSpawnInterval) {
                spawnOpponentCar();
                lastOpponentSpawnTime = currentTime;
            }

            for (let i = 0; i < opponentCars.length; i++) {
                const car = opponentCars[i];
                car.update();
                car.draw();

                if (checkCollision(playerCar, car)) {
                    endGame();
                    return;
                }

                if (car.y > canvas.height) {
                    opponentCars.splice(i, 1);
                    i--;
                }
            }

            score += 0.1;
            scoreDisplay.textContent = Math.floor(score);

            if (currentTime - phaseStartTime > phaseDuration) {
                completePhase();
                return;
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Event Listeners for menu navigation
        startButton.addEventListener('click', showMenu);
        goToShopButton.addEventListener('click', showShop);
        backToMenuFromShopButton.addEventListener('click', showMenu);

        // Add click/touch event listener to the canvas
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', handleCanvasClick); // touchstart also works as a tap


        document.addEventListener('keydown', (e) => {
            if (gameState !== 'playing' || !playerCar) return;

            if (e.key === 'ArrowLeft') {
                currentLane = Math.max(0, currentLane - 1);
            } else if (e.key === 'ArrowRight') {
                currentLane = Math.min(numLanes - 1, currentLane + 1);
            }
        });

        window.onload = function() {
            calculateLanePositions();
            showMenu();
        };

        // --- Firebase Integration ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');

        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    userIdDisplay.textContent = userId;
                    console.log("Authenticated as:", userId);
                    fetchGameData();
                    setupRankingListener();
                } else {
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Firebase Auth Error:", error);
                        userId = crypto.randomUUID();
                        userIdDisplay.textContent = userId + " (Anônimo - Erro de Autenticação)";
                        fetchGameData();
                        setupRankingListener();
                    }
                }
            });
        } else {
            console.warn("Firebase config not found. Running without persistence.");
            userId = crypto.randomUUID();
            userIdDisplay.textContent = userId + " (Sem Persistência)";
            highScoreDisplay.textContent = localStorage.getItem('localHighScore') || 0;
            trophyCountDisplay.textContent = localStorage.getItem('localTrophies') || 0;
            highestPhaseCompleted = parseInt(localStorage.getItem('localHighestPhase') || 0);
            ownedPlayerCarIds = JSON.parse(localStorage.getItem('localOwnedCars') || '["car_sport_red_default", "car_truck_blue_default", "car_f1_yellow_default"]');
            selectedPlayerCarId = localStorage.getItem('localSelectedCarId') || 'car_sport_red_default';

            rankingList.innerHTML = '<li><span>Ranking não disponível (sem Firebase)</span><span></span></li>';
            showMenu();
        }

        async function fetchGameData() {
            if (!db || !userId) return;
            try {
                const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/userData/gameProgress`);
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    highScore = data.highScore || 0;
                    trophiesCollected = data.trophiesCollected || 0;
                    highestPhaseCompleted = data.highestPhaseCompleted || 0;
                    ownedPlayerCarIds = data.ownedPlayerCarIds || ['car_sport_red_default', 'car_truck_blue_default', 'car_f1_yellow_default'];
                    selectedPlayerCarId = data.selectedPlayerCarId || 'car_sport_red_default';
                } else {
                    highScore = 0;
                    trophiesCollected = 0;
                    highestPhaseCompleted = 0;
                    ownedPlayerCarIds = ['car_sport_red_default', 'car_truck_blue_default', 'car_f1_yellow_default'];
                    selectedPlayerCarId = 'car_sport_red_default';
                }
                highScoreDisplay.textContent = highScore;
                trophyCountDisplay.textContent = trophiesCollected;
                generatePhaseButtons();
                generateCarSelection();
                generateCarShop();
            } catch (e) {
                console.error("Error fetching game data: ", e);
            }
        }

        async function saveGameData() {
            if (!db || !userId) {
                if (score > parseInt(localStorage.getItem('localHighScore') || 0)) {
                    localStorage.setItem('localHighScore', Math.floor(score));
                    highScoreDisplay.textContent = Math.floor(score);
                }
                localStorage.setItem('localTrophies', trophiesCollected);
                trophyCountDisplay.textContent = trophiesCollected;
                localStorage.setItem('localHighestPhase', highestPhaseCompleted);
                localStorage.setItem('localOwnedCars', JSON.stringify(ownedPlayerCarIds));
                localStorage.setItem('localSelectedCarId', selectedPlayerCarId);
                return;
            }

            try {
                const userGameProgressRef = doc(db, `artifacts/${appId}/users/${userId}/userData/gameProgress`);
                const currentData = {
                    highScore: Math.max(highScore, Math.floor(score)),
                    trophiesCollected: trophiesCollected,
                    highestPhaseCompleted: highestPhaseCompleted,
                    ownedPlayerCarIds: ownedPlayerCarIds,
                    selectedPlayerCarId: selectedPlayerCarId,
                    lastPlayed: new Date()
                };
                await setDoc(userGameProgressRef, currentData, { merge: true });
                highScoreDisplay.textContent = currentData.highScore;
            } catch (e) {
                console.error("Error saving game data: ", e);
            }

            try {
                const scoresCollectionRef = getScoresCollectionRef();
                if (scoresCollectionRef) {
                    await addDoc(scoresCollectionRef, {
                        userId: userId,
                        score: Math.floor(score),
                        timestamp: new Date(),
                    });
                }
            } catch (e) {
                console.error("Error adding score to public ranking: ", e);
            }
        }

        function setupRankingListener() {
            const scoresCollectionRef = getScoresCollectionRef();
            if (!scoresCollectionRef) return;

            const q = query(scoresCollectionRef);

            onSnapshot(q, (snapshot) => {
                let scores = [];
                snapshot.forEach((doc) => {
                    scores.push(doc.data());
                });

                scores.sort((a, b) => b.score - a.score);
                scores = scores.slice(0, 10);
                updateRankingDisplay(scores);
            }, (error) => {
                console.error("Error fetching ranking: ", error);
                rankingList.innerHTML = '<li><span>Erro ao carregar ranking.</span><span></span></li>';
            });
        }

        function updateRankingDisplay(scores) {
            rankingList.innerHTML = '';
            if (scores.length === 0) {
                rankingList.innerHTML = '<li><span>Nenhuma pontuação ainda.</span><span></span></li>';
                return;
            }
            scores.forEach((data, index) => {
                const li = document.createElement('li');
                const displayName = data.userId === userId ? "Você" : `Jogador ${index + 1}`;
                li.innerHTML = `<span>${index + 1}. ${displayName}</span><span>${Math.floor(data.score)}</span>`;
                rankingList.appendChild(li);
            });
        }
    </script>
</body>
</html>
