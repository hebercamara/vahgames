<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coelho Corredor da Floresta</title>
    <!-- Inclui Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para o corpo e a fonte */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Fundo escuro */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita barras de rolagem */
        }
        /* Estilo para o canvas do jogo */
        canvas {
            background-color: #2d3748; /* Fundo do jogo mais claro */
            border-radius: 1rem; /* Cantos arredondados */
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.5); /* Sombra para destaque */
            display: block; /* Remove espaço extra abaixo do canvas */
            max-width: 90vw; /* Garante que o canvas se ajuste à largura da tela */
            max-height: 90vh; /* Garante que o canvas se ajuste à altura da tela */
            touch-action: none; /* Previne o comportamento padrão do navegador em eventos de toque */
        }
        /* Estilo para a tela de Game Over */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            text-align: center;
            border-radius: 1rem;
        }
        /* Estilo para o botão de reiniciar */
        #restartButton {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background-color: #4CAF50; /* Verde */
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background-color 0.3s ease;
        }
        #restartButton:hover {
            background-color: #45a049; /* Verde mais escuro no hover */
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-900 text-white p-4">
    <h1 class="text-4xl font-bold mb-6 text-green-400">Coelho Corredor da Floresta</h1>
    <div class="relative w-full max-w-lg aspect-[9/16] flex items-center justify-center">
        <canvas id="gameCanvas" class="w-full h-full"></canvas>
        <div id="gameOverScreen" class="hidden">
            <p class="text-4xl font-bold mb-4">Fim de Jogo!</p>
            <p class="text-2xl mb-6">Sua Pontuação: <span id="finalScore">0</span></p>
            <button id="restartButton" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg">Reiniciar</button>
        </div>
    </div>
    <div class="mt-6 text-center">
        <p class="text-xl">Pontuação: <span id="scoreDisplay" class="font-bold text-yellow-400">0</span></p>
        <p class="text-sm text-gray-400 mt-2">Deslize para cima para pular, para os lados para mudar de faixa.</p>
    </div>

    <script>
        // Obtém o canvas e seu contexto 2D
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Elementos da interface do usuário
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');

        // Configurações do jogo
        const GAME_WIDTH = 360; // Largura lógica do jogo
        const GAME_HEIGHT = 640; // Altura lógica do jogo
        const LANE_WIDTH = GAME_WIDTH / 3; // Largura de cada faixa

        // Redimensiona o canvas para caber na tela e mantém a proporção
        function resizeCanvas() {
            const aspectRatio = GAME_WIDTH / GAME_HEIGHT;
            let newWidth = window.innerWidth * 0.9;
            let newHeight = window.innerHeight * 0.9;

            if (newWidth / newHeight > aspectRatio) {
                newWidth = newHeight * aspectRatio;
            } else {
                newHeight = newWidth / aspectRatio;
            }

            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            canvas.style.width = `${newWidth}px`;
            canvas.style.height = `${newHeight}px`;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Chama no carregamento inicial

        // Variáveis do jogo
        let player;
        let obstacles = [];
        let score = 0;
        let gameSpeed = 2.5; // Velocidade inicial do jogo (ajustado para ser mais lento)
        let gameOver = false;
        let lastObstacleTime = 0;
        const OBSTACLE_INTERVAL = 2000; // Intervalo mínimo entre obstáculos (ms) (ajustado para ser mais longo)

        // Propriedades do jogador (coelho)
        const PLAYER_WIDTH = 40;
        const PLAYER_HEIGHT = 60;
        const PLAYER_START_Y = GAME_HEIGHT - PLAYER_HEIGHT - 20; // Posição Y inicial do coelho
        const JUMP_HEIGHT = 150; // Altura máxima do pulo
        const JUMP_SPEED = 8; // Velocidade do pulo

        // Objeto do jogador
        function Player() {
            this.width = PLAYER_WIDTH;
            this.height = PLAYER_HEIGHT;
            this.x = LANE_WIDTH + (LANE_WIDTH - this.width) / 2; // Começa na faixa do meio
            this.y = PLAYER_START_Y;
            this.lane = 1; // 0: esquerda, 1: meio, 2: direita
            this.velocityY = 0;
            this.isJumping = false;
            this.isFalling = false;

            // Desenha o coelho
            this.draw = function() {
                ctx.fillStyle = '#FFD700'; // Cor amarela para o coelho (placeholder)
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Desenha orelhas
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(this.x + this.width / 4, this.y - 15, this.width / 4, 20);
                ctx.fillRect(this.x + this.width / 2, this.y - 15, this.width / 4, 20);
            };

            // Atualiza a posição do coelho (para pulo)
            this.update = function() {
                if (this.isJumping || this.isFalling) {
                    this.y += this.velocityY;
                    this.velocityY += 0.5; // Gravidade

                    // Se o coelho caiu de volta ao chão
                    if (this.y >= PLAYER_START_Y) {
                        this.y = PLAYER_START_Y;
                        this.isJumping = false;
                        this.isFalling = false;
                        this.velocityY = 0;
                    }
                }
            };

            // Inicia o pulo
            this.jump = function() {
                if (!this.isJumping && !this.isFalling) {
                    this.isJumping = true;
                    this.velocityY = -JUMP_SPEED; // Impulso para cima
                }
            };

            // Muda de faixa
            this.changeLane = function(direction) { // -1 para esquerda, 1 para direita
                const targetLane = this.lane + direction;
                if (targetLane >= 0 && targetLane <= 2) {
                    this.lane = targetLane;
                    this.x = this.lane * LANE_WIDTH + (LANE_WIDTH - this.width) / 2;
                }
            };
        }

        // Propriedades dos obstáculos
        const OBSTACLE_WIDTH = 50;
        const OBSTACLE_HEIGHT = 50;

        // Objeto do obstáculo
        function Obstacle(lane, type) {
            this.width = OBSTACLE_WIDTH;
            this.height = OBSTACLE_HEIGHT;
            this.lane = lane;
            this.type = type; // 'jump' ou 'lane_block'
            this.x = this.lane * LANE_WIDTH + (LANE_WIDTH - this.width) / 2;
            this.y = -this.height; // Começa fora da tela (em cima)

            // Desenha o obstáculo
            this.draw = function() {
                if (this.type === 'jump') {
                    ctx.fillStyle = '#8B4513'; // Marrom para tronco/rocha
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    // Desenha um pequeno detalhe para parecer um tronco
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(this.x + 10, this.y + 10, this.width - 20, this.height - 20);
                } else if (this.type === 'lane_block') {
                    ctx.fillStyle = '#4CAF50'; // Verde para árvore/arbusto grande
                    ctx.fillRect(this.x, this.y, this.width, this.height * 1.5); // Mais alto
                    // Desenha uma copa de árvore
                    ctx.fillStyle = '#228B22';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y + this.height * 0.5, this.width * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
            };

            // Atualiza a posição do obstáculo
            this.update = function() {
                this.y += gameSpeed;
            };
        }

        // Desenha o fundo (floresta)
        function drawBackground() {
            // Desenha as "faixas"
            ctx.fillStyle = '#3a475a'; // Cor mais escura para as faixas
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Linhas de separação das faixas
            ctx.fillStyle = '#556270'; // Cor das linhas
            ctx.fillRect(LANE_WIDTH - 2, 0, 4, GAME_HEIGHT);
            ctx.fillRect(LANE_WIDTH * 2 - 2, 0, 4, GAME_HEIGHT);

            // Desenha o lobo (predador) no fundo
            ctx.fillStyle = '#607d8b'; // Cor cinza para o lobo (placeholder)
            const wolfWidth = GAME_WIDTH * 0.6;
            const wolfHeight = GAME_HEIGHT * 0.2;
            ctx.fillRect((GAME_WIDTH - wolfWidth) / 2, GAME_HEIGHT - wolfHeight - 10, wolfWidth, wolfHeight);
            ctx.fillStyle = '#455a64'; // Olhos do lobo
            ctx.fillRect((GAME_WIDTH - wolfWidth) / 2 + wolfWidth * 0.2, GAME_HEIGHT - wolfHeight - 50, 10, 10);
            ctx.fillRect((GAME_WIDTH - wolfWidth) / 2 + wolfWidth * 0.8 - 10, GAME_HEIGHT - wolfHeight - 50, 10, 10);
        }

        // Inicializa o jogo
        function initGame() {
            player = new Player();
            obstacles = [];
            score = 0;
            gameSpeed = 2.5; // Re-inicializa a velocidade
            gameOver = false;
            lastObstacleTime = performance.now(); // Define o tempo inicial para o primeiro obstáculo
            scoreDisplay.textContent = score;
            gameOverScreen.classList.add('hidden'); // Esconde a tela de game over
            animate(); // Inicia o loop do jogo
        }

        // Loop principal do jogo
        function animate(currentTime) {
            if (gameOver) {
                return; // Para o loop se o jogo acabou
            }

            // Limpa o canvas
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Desenha o fundo
            drawBackground();

            // Atualiza e desenha o jogador
            player.update();
            player.draw();

            // Gera novos obstáculos
            if (currentTime - lastObstacleTime > OBSTACLE_INTERVAL / gameSpeed) { // Intervalo diminui com a velocidade
                const randomLane = Math.floor(Math.random() * 3);
                const randomType = Math.random() < 0.7 ? 'jump' : 'lane_block'; // Mais obstáculos de pular
                obstacles.push(new Obstacle(randomLane, randomType));
                lastObstacleTime = currentTime;
            }

            // Atualiza, desenha e remove obstáculos fora da tela
            for (let i = 0; i < obstacles.length; i++) {
                const obstacle = obstacles[i];
                obstacle.update();
                obstacle.draw();

                // Colisão
                // Verifica sobreposição de caixa delimitadora (bounding box)
                const isCollidingX = player.x < obstacle.x + obstacle.width && player.x + player.width > obstacle.x;
                const isCollidingY = player.y < obstacle.y + obstacle.height && player.y + player.height > obstacle.y;

                if (player.lane === obstacle.lane && isCollidingX && isCollidingY) {
                    let actualCollision = false;

                    if (obstacle.type === 'jump') {
                        // Se for um obstáculo de pular, a colisão ocorre se:
                        // 1. O jogador NÃO estiver pulando.
                        // 2. OU o jogador estiver pulando, mas a parte inferior do jogador ainda estiver abaixo do topo do obstáculo (não pulou alto o suficiente).
                        // Adicionamos uma pequena margem (e.g., 5 pixels) para a detecção de "limpeza" do obstáculo.
                        if (!player.isJumping || (player.y + player.height > obstacle.y + 5)) {
                            actualCollision = true;
                        }
                    } else if (obstacle.type === 'lane_block') {
                        // Se for um obstáculo de bloqueio de faixa, a colisão ocorre se:
                        // 1. O jogador NÃO estiver pulando. (Se estiver pulando, ele passa por cima)
                        if (!player.isJumping) {
                            actualCollision = true;
                        }
                    }

                    if (actualCollision) {
                        gameOver = true;
                        finalScoreDisplay.textContent = score;
                        gameOverScreen.classList.remove('hidden');
                        return;
                    }
                }

                // Remove obstáculos que saíram da tela
                if (obstacle.y > GAME_HEIGHT) {
                    obstacles.splice(i, 1);
                    i--; // Ajusta o índice após remover um elemento
                    score += 10; // Aumenta a pontuação ao passar por um obstáculo
                    scoreDisplay.textContent = score;

                    // Aumenta a velocidade do jogo gradualmente
                    if (score % 100 === 0 && gameSpeed < 8) { // Aumenta a cada 100 pontos até a velocidade 8
                        gameSpeed += 0.1;
                    }
                }
            }

            // Solicita o próximo frame de animação
            requestAnimationFrame(animate);
        }

        // --- Controles de Toque ---
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            if (gameOver) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            // Determina se é um deslize vertical ou horizontal
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Deslize horizontal (mudar de faixa)
                if (deltaX > 50) { // Deslize para a direita
                    player.changeLane(1);
                } else if (deltaX < -50) { // Deslize para a esquerda
                    player.changeLane(-1);
                }
            } else {
                // Deslize vertical (pular)
                if (deltaY < -50) { // Deslize para cima
                    player.jump();
                }
            }
        });

        // Evento de clique para o botão de reiniciar
        restartButton.addEventListener('click', initGame);

        // Inicia o jogo quando a janela carregar
        window.onload = initGame;
    </script>
</body>
</html>
