<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Fuga do Sonic · VAH Games</title>
    <meta name="theme-color" content="#0C0D14">
    <link rel="icon" type="image/png" href="/images/site/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <style>
        /* Visual do VAH Games (DESIGN.md) com fundo em pixel art */
        :root { --canvas:#0C0D14; --panel:#1B1C24; --line:#292A30; --ink:#fff; --body:#E5E6EE; --muted:#BDBFCE;
                --lime:#C7FF5B; --lime-ink:#0F1A00; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { font-family: Outfit, -apple-system, "Segoe UI", sans-serif; color: var(--body); overflow: hidden;
               background: var(--canvas) url('/images/fuga-do-sonic/fundo-pixel.png') center bottom / cover no-repeat fixed;
               image-rendering: pixelated; -webkit-tap-highlight-color: transparent; }
        button { font: inherit; }

        .game-container { height: 100dvh; max-width: 520px; margin: 0 auto; padding: 12px 16px 68px;
                          display: flex; flex-direction: column; align-items: center; gap: 10px; image-rendering: auto; }
        .top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .top h1 { margin: 0; font-family: Unbounded, Outfit, sans-serif; font-size: clamp(15px, 4.4vw, 21px); font-weight: 900;
                  text-transform: uppercase; color: var(--ink); white-space: nowrap; text-shadow: 0 3px 0 rgba(0,0,0,.45); }
        .top-spacer { width: 44px; }
        .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
                border: 0; border-radius: 999px; font-size: 15px; font-weight: 800; cursor: pointer; text-decoration: none;
                transition: transform .12s, filter .12s, background .12s; white-space: nowrap; }
        .pill:active { transform: translateY(1px); }
        .pill-ghost { background: rgba(255,255,255,.12); color: var(--ink); backdrop-filter: blur(4px); }
        .pill-ghost:hover { background: rgba(255,255,255,.22); }
        .pill-lime { background: var(--lime); color: var(--lime-ink); }
        .pill-lime:hover { filter: brightness(1.05); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
        @media (max-width: 420px) { .hide-sm { display: none; } }

        .game-info { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .game-info > div { padding: 8px 12px; border-radius: 16px; background: rgba(27,28,36,.78); backdrop-filter: blur(4px);
                           font-size: 18px; font-weight: 900; color: var(--ink); }
        .game-info > div::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 700; letter-spacing: .4px;
                                   text-transform: uppercase; color: var(--muted); }
        #rings { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; }
        #rings::before { flex-basis: 100%; }
        .ring-icon { width: 20px; height: 20px; background: url('/images/fuga-do-sonic/argola.png') 0 0 / 400% 100% no-repeat;
                     image-rendering: pixelated; animation: ringSpin .4s steps(4) infinite; }
        @keyframes ringSpin { to { background-position: -80px 0; } }

        /* Área do jogo: proporção fixa 360x500, cabendo na altura da tela (antes esticava conforme a largura) */
        .stage { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
        .stage-inner { position: relative; width: min(100%, calc((100dvh - 280px) * 0.72)); }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 360 / 500; border-radius: 16px; touch-action: none;
                 box-shadow: 0 0 0 4px rgba(12,13,20,.85), 0 10px 30px rgba(0,0,0,.6); }
        .hint { margin: 0; padding: 8px 14px; border-radius: 16px; background: rgba(12,13,20,.78); backdrop-filter: blur(4px);
                font-size: 13px; line-height: 1.4; color: var(--body); text-align: center; }
        .hint b { color: var(--lime); }

        .game-over-screen, .loading-screen { position: absolute; inset: 0; border-radius: 16px; display: flex; flex-direction: column;
                                             align-items: center; justify-content: center; gap: 8px; padding: 20px; text-align: center;
                                             background: rgba(12,13,20,.78); backdrop-filter: blur(3px); z-index: 10; }
        .loading-screen { z-index: 20; }
        .game-over-screen h2 { margin: 0; font-family: Unbounded, Outfit, sans-serif; font-weight: 900; font-size: 24px;
                               text-transform: uppercase; color: var(--ink); }
        .game-over-screen p, .loading-screen p { margin: 0; font-size: 17px; font-weight: 700; color: var(--body); }
        .game-over-screen p b { color: var(--lime); font-size: 22px; }
        .restart-button { margin-top: 10px; }
        /* não depende do Tailwind (CDN) para esconder as telas de carregando/fim de jogo */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="top">
            <a class="pill pill-ghost" href="/" aria-label="Voltar ao VAH Games">← <span class="hide-sm">VAH Games</span></a>
            <h1>A Fuga do Sonic</h1>
            <span class="top-spacer"></span>
        </div>
        <div class="game-info">
            <div id="score" data-label="Pontos">0</div>
            <div id="rings" data-label="Argolas"><span class="ring-icon" aria-hidden="true"></span><span id="ringCount">0</span></div>
            <div id="high-score" data-label="Recorde">0</div>
        </div>
        <div class="stage">
            <div class="stage-inner">
                <canvas id="gameCanvas" width="360" height="500"></canvas>
                <div id="gameOverScreen" class="game-over-screen hidden">
                    <h2>Fim de jogo!</h2>
                    <p>Você fez <b id="finalScore">0</b> pontos</p>
                    <button id="restartButton" class="pill pill-lime restart-button" type="button">Jogar de novo</button>
                </div>
                <div id="loadingScreen" class="loading-screen">
                    <p>Carregando…</p>
                </div>
            </div>
        </div>
        <p class="hint">Deslize para os lados para trocar de faixa, para cima para pular e para baixo para <b>rolar</b> por baixo dos galhos (no computador: setas).<br>Cada <b>argola</b> vale 10 pontos e a cada 10 você ganha <b>+100</b>!</p>
    </div>

    <script type="module">
        // VAH Games: o Firebase importado aqui nunca era usado; se o servidor dele falhasse, o jogo não abria.


        // --- Game Logic ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const loadingScreen = document.getElementById('loadingScreen');

        let player;
        let chaser;
        let obstacles = [];
        let score = 0;
        let highScore = localStorage.getItem('subwaySurfersHighScore') || 0;
        let gameOver = false;
        let gameSpeed = 5; // Initial speed
        const laneWidth = canvas.width / 3; // 3 lanes
        const playerWidth = 60; // Adjusted for Sonic size
        const playerHeight = 60; // Adjusted for Sonic size
        const jumpSpeed = 20; // Increased for higher and faster jump
        const gravity = 1; // Increased for faster descent after jump peak
        const GROUND_Y = canvas.height - playerHeight - 92; // Sonic um pouco acima da borda: o Robotnik vem atrás
        const ROLL_FRAMES = 40;      // quadros rolando (o jogo anda por quadros, como a pista e os obstáculos)
        const BALL_FRAME_MS = 45;    // animação rápida da bola
        let obstacleSpawnInterval = 1000; // milliseconds - now dynamic
        const minObstacleSpawnInterval = 400; // Minimum interval to prevent impossible spawns
        const intervalReductionRate = 2; // How much interval reduces per score point (adjust for difficulty)
        let lastObstacleSpawnTime = 0;

        // Game Images
        const sonicRunFrames = [
            new Image(),
            new Image()
        ];
        const roadImage = new Image();
        const smallObstacleImage = new Image();
        const largeObstacleImage = new Image();
        const ringSheet = new Image(); // 4 quadros de 17x17 lado a lado
        const robotnikImage = new Image();
        const treeImage = new Image();
        const ballSheet = new Image(); // 4 quadros de 26x68 (bola + rastro)

        // Setting direct links for images
        sonicRunFrames[0].src = '/images/fuga-do-sonic/Sonic-Running-1.png';
        sonicRunFrames[1].src = '/images/fuga-do-sonic/Sonic-Running-2.png';
        roadImage.src = '/images/fuga-do-sonic/Estrada.png';
        smallObstacleImage.src = '/images/fuga-do-sonic/Obstaculo-pequeno.png';
        largeObstacleImage.src = '/images/fuga-do-sonic/Obstaculo-grande.png';
        ringSheet.src = '/images/fuga-do-sonic/argola.png';
        robotnikImage.src = '/images/fuga-do-sonic/robotnik.png';
        treeImage.src = '/images/fuga-do-sonic/arvore.png';
        ballSheet.src = '/images/fuga-do-sonic/bola.png';

        let imagesLoaded = 0;
        const allImages = [
            ...sonicRunFrames,
            roadImage,
            smallObstacleImage,
            largeObstacleImage,
            ringSheet,
            robotnikImage,
            treeImage,
            ballSheet
        ];
        const totalImages = allImages.length;

        function loadImage(image) {
            return new Promise((resolve, reject) => {
                image.onload = () => {
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        loadingScreen.classList.add('hidden');
                        initGame();
                        requestAnimationFrame(gameLoop);
                    }
                    resolve();
                };
                image.onerror = () => {
                    console.error("Error loading image:", image.src);
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        loadingScreen.classList.add('hidden');
                        initGame();
                        requestAnimationFrame(gameLoop);
                    }
                    reject();
                };
            });
        }

        // Load all images
        Promise.all(allImages.map(loadImage)).catch(() => {
            console.warn("Some images could not be loaded. The game might not display all assets.");
        });

        // Road scrolling position
        let roadY1 = 0;
        let roadY2 = -canvas.height; // Start the second road image above the canvas


        // Player Object (Sonic)
        function Player() {
            this.width = playerWidth;
            this.height = playerHeight;
            this.lane = 1; // 0: left, 1: center, 2: right
            this.x = this.lane * laneWidth + (laneWidth - this.width) / 2;
            this.y = GROUND_Y;
            this.rollFrames = 0;
            this.velocityY = 0;
            this.isJumping = false;
            this.frameIndex = 0; // Current frame index for animation
            this.animationSpeed = 8; // Animation speed (lower = faster)
            this.frameCounter = 0; // Counter to control animation speed

            this.isRolling = function() { return this.rollFrames > 0; };

            this.draw = function() {
                if (this.isRolling() && ballSheet.complete && ballSheet.naturalWidth) {
                    // bola girando: 4 quadros bem rápidos, centro da bola no centro do Sonic
                    const frame = Math.floor(performance.now() / BALL_FRAME_MS) % 4;
                    const w = 46, h = w * 68 / 26;
                    const ballCenter = 23.4 * (h / 68);
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(ballSheet, frame * 26, 0, 26, 68, this.x + this.width / 2 - w / 2, this.y + this.height / 2 - ballCenter + 8, w, h);
                    ctx.restore();
                    return;
                }
                // Draw Sonic image if loaded, otherwise draw nothing
                if (sonicRunFrames[this.frameIndex].complete && sonicRunFrames[this.frameIndex].naturalWidth !== 0) {
                    ctx.drawImage(sonicRunFrames[this.frameIndex], this.x, this.y, this.width, this.height);
                } else {
                    // Fallback visual: draw a blue rectangle if image fails to load
                    ctx.fillStyle = '#0000FF';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            };

            this.update = function() {
                // Apply gravity if jumping
                if (this.isJumping) {
                    this.y += this.velocityY;
                    this.velocityY += gravity;

                    // Land on the ground
                    if (this.y >= GROUND_Y) {
                        this.y = GROUND_Y;
                        this.isJumping = false;
                        this.velocityY = 0;
                    }
                }

                if (this.rollFrames > 0) this.rollFrames--;

                // Running animation
                this.frameCounter++;
                if (this.frameCounter >= this.animationSpeed) {
                    this.frameIndex = (this.frameIndex + 1) % sonicRunFrames.length;
                    this.frameCounter = 0;
                }
            };

            // Rolar: passa por baixo do galho da árvore. No ar, apertar para baixo faz descer mais rápido.
            this.roll = function() {
                if (this.isJumping) {
                    this.velocityY = Math.max(this.velocityY, 14);
                    return;
                }
                this.rollFrames = ROLL_FRAMES;
            };

            this.jump = function() {
                if (this.isRolling()) return;
                if (!this.isJumping) {
                    this.isJumping = true;
                    this.velocityY = -jumpSpeed;
                }
            };

            this.changeLane = function(direction) { // -1 for left, 1 for right
                this.lane += direction;
                if (this.lane < 0) this.lane = 0;
                if (this.lane > 2) this.lane = 2;
                this.x = this.lane * laneWidth + (laneWidth - this.width) / 2;
            };
        }

        // Perseguidor: o Robotnik na nave, flutuando atrás do Sonic e seguindo a faixa dele com atraso
        function Chaser() {
            this.width = 91;
            this.height = this.width * 198 / 192;
            this.x = canvas.width / 2 - this.width / 2;
            this.baseY = canvas.height - this.height + 6;
            this.t = 0;

            this.update = function() {
                this.t += 1 / 60;
                const target = player.x + player.width / 2 - this.width / 2;
                this.x += (target - this.x) * 0.06;
            };

            this.draw = function() {
                const bob = Math.sin(this.t * 3.2) * 5 + Math.sin(this.t * 7.1) * 1.2;
                if (robotnikImage.complete && robotnikImage.naturalWidth) {
                    ctx.drawImage(robotnikImage, this.x, this.baseY + bob, this.width, this.height);
                } else {
                    ctx.fillStyle = '#C62828';
                    ctx.fillRect(this.x, this.baseY + bob, this.width, this.height);
                }
            };
        }

        // --- Argolas ---
        // Aparecem em fileiras no caminho; ao pegar, sobem e somem. A cada RING_BONUS_EVERY argolas, bônus de pontos.
        const RING_SIZE = 34;
        const RING_POINTS = 10;
        const RING_BONUS_EVERY = 10;
        const RING_BONUS_POINTS = 100;
        let rings = [];
        let ringsCollected = 0;
        let lastRingSpawnTime = 0;
        let nextRingDelay = 1200;
        let popups = []; // textos de bônus que sobem
        const ringCountDisplay = document.getElementById('ringCount');

        function Ring(lane, y, lift = 0) {
            this.lane = lane;
            this.size = RING_SIZE;
            this.x = lane * laneWidth + (laneWidth - this.size) / 2;
            this.y = y;
            this.lift = lift; // argolas em arco ficam mais altas: só se pega pulando
            this.collected = false;
            this.t = 0; // tempo desde que foi pega (s)

            this.update = function() {
                this.y += gameSpeed;
                if (this.collected) {
                    this.t += 1 / 60;
                    this.y -= gameSpeed + 4; // sobe enquanto some
                }
            };

            this.draw = function(time) {
                const frame = Math.floor(time / 100) % 4;
                const grow = this.collected ? 1 + this.t * 1.2 : 1;
                const s = this.size * grow;
                const x = this.x + (this.size - s) / 2;
                const y = this.y - this.lift + (this.size - s) / 2;
                ctx.save();
                if (this.collected) ctx.globalAlpha = Math.max(0, 1 - this.t / 0.45);
                ctx.imageSmoothingEnabled = false;
                if (ringSheet.complete && ringSheet.naturalWidth) {
                    ctx.drawImage(ringSheet, frame * 17, 0, 17, 17, x, y, s, s);
                } else {
                    ctx.strokeStyle = '#FFE600';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(x + s / 2, y + s / 2, s / 2 - 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            };
        }

        // Fileira de argolas numa faixa sem obstáculo chegando; às vezes em arco por cima de um obstáculo baixo
        function spawnRings(currentTime) {
            const free = [0, 1, 2].filter(l => !obstacles.some(o => o.lanes.includes(l) && o.y < 200));
            const shortAhead = obstacles.filter(o => o.type === 'short' && o.y < 60 && o.y > -60);
            const count = 3 + Math.floor(Math.random() * 4);
            if (shortAhead.length && Math.random() < 0.5) {
                // arco de argolas sobre o obstáculo baixo
                const o = shortAhead[0];
                for (let k = 0; k < 5; k++) {
                    const lift = Math.sin((k / 4) * Math.PI) * 70;
                    rings.push(new Ring(o.lane, o.y - 30 - k * 42 + 90, lift));
                }
            } else if (free.length) {
                const lane = free[Math.floor(Math.random() * free.length)];
                for (let k = 0; k < count; k++) rings.push(new Ring(lane, -RING_SIZE - k * 46));
            }
            lastRingSpawnTime = currentTime;
            nextRingDelay = 900 + Math.random() * 1300;
        }

        function collectRing(ring) {
            ring.collected = true;
            ringsCollected += 1;
            score += RING_POINTS;
            ringCountDisplay.textContent = ringsCollected;
            if (ringsCollected % RING_BONUS_EVERY === 0) {
                score += RING_BONUS_POINTS;
                popups.push({ text: `${ringsCollected} argolas! +${RING_BONUS_POINTS}`, y: canvas.height / 2, t: 0 });
            }
        }

        function ringTouchesPlayer(ring) {
            const pad = 6;
            const ry = ring.y - ring.lift;
            return ring.lane === player.lane &&
                   player.x + pad < ring.x + ring.size && player.x + player.width - pad > ring.x &&
                   player.y + pad < ry + ring.size && player.y + player.height - pad > ry;
        }

        function drawPopups() {
            popups.forEach(p => {
                p.t += 1 / 60;
                const a = Math.max(0, 1 - p.t / 1.4);
                ctx.save();
                ctx.globalAlpha = a;
                ctx.font = '900 26px Outfit, Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.lineWidth = 5;
                ctx.strokeStyle = 'rgba(12,13,20,0.85)';
                ctx.fillStyle = '#FFE600';
                const y = p.y - p.t * 60;
                ctx.strokeText(p.text, canvas.width / 2, y);
                ctx.fillText(p.text, canvas.width / 2, y);
                ctx.restore();
            });
            popups = popups.filter(p => p.t < 1.4);
        }

        // Obstacle Object
        // Árvore com galho: o tronco ocupa uma faixa (bate sempre, nem pulando passa) e o galho cobre a
        // faixa vizinha (só passa rolando). side = 1 galho para a direita, -1 para a esquerda.
        const TREE_SCALE = 0.9;
        const TREE_TRUNK_X = 88; // centro do tronco na imagem (230x189), com o galho para a direita
        function Tree(lane, side) {
            this.type = 'tree';
            this.lane = lane;
            this.side = side;
            this.branchLane = lane + side;
            this.lanes = [lane, lane + side];
            this.width = 230 * TREE_SCALE;
            this.height = 189 * TREE_SCALE;
            this.y = -this.height;
            const laneCenter = lane * laneWidth + laneWidth / 2;
            const trunk = TREE_TRUNK_X * TREE_SCALE;
            this.x = side === 1 ? laneCenter - trunk : laneCenter - (this.width - trunk);

            this.update = function() { this.y += gameSpeed; };

            this.draw = function() {
                if (!(treeImage.complete && treeImage.naturalWidth)) return;
                ctx.save();
                if (this.side === 1) {
                    ctx.drawImage(treeImage, this.x, this.y, this.width, this.height);
                } else {
                    ctx.translate(this.x + this.width, this.y);
                    ctx.scale(-1, 1);
                    ctx.drawImage(treeImage, 0, 0, this.width, this.height);
                }
                ctx.restore();
            };

            // faixa vertical onde a árvore bate (base do tronco e altura do galho)
            this.hits = function(p) {
                const top = this.y + this.height * 0.3, bottom = this.y + this.height * 0.82;
                if (p.y + p.height - 8 < top || p.y + 8 > bottom) return false;
                if (p.lane === this.lane) return true;                 // tronco
                if (p.lane === this.branchLane) return !p.isRolling(); // galho: só rolando
                return false;
            };
        }

        function Obstacle(lane, type) {
            this.width = (type === 'tall') ? 80 : 60; // Adjust width for image
            this.height = (type === 'tall') ? 80 : 40; // Adjust height for image
            this.lane = lane;
            this.lanes = [lane];
            this.x = this.lane * laneWidth + (laneWidth - this.width) / 2;
            this.y = -this.height; // Start off-screen at the top
            this.type = type; // Store type to choose correct image

            this.draw = function() {
                let imageToDraw;
                if (this.type === 'short') {
                    imageToDraw = smallObstacleImage;
                } else {
                    imageToDraw = largeObstacleImage;
                }

                if (imageToDraw.complete && imageToDraw.naturalWidth !== 0) {
                    ctx.drawImage(imageToDraw, this.x, this.y, this.width, this.height);
                } else {
                    // Fallback visual: draw a brown rectangle if image fails to load
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            };

            this.update = function() {
                this.y += gameSpeed; // Move down the screen
            };
        }

        function initGame() {
            player = new Player();
            chaser = new Chaser();
            obstacles = [];
            rings = [];
            popups = [];
            ringsCollected = 0;
            lastRingSpawnTime = 0;
            nextRingDelay = 1200;
            ringCountDisplay.textContent = 0;
            score = 0;
            gameOver = false;
            gameSpeed = 5;
            obstacleSpawnInterval = 1000; // Reset interval
            lastObstacleSpawnTime = 0;
            roadY1 = 0; // Reset road position
            roadY2 = -canvas.height; // Reset road position
            updateScoreDisplay();
            highScoreDisplay.textContent = `${highScore}`;
            gameOverScreen.classList.add('hidden');
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = `${Math.floor(score)}`;
        }

        function checkCollision(player, obstacle) {
            // Simple AABB collision detection
            return player.x < obstacle.x + obstacle.width &&
                   player.x + player.width > obstacle.x &&
                   player.y < obstacle.y + obstacle.height &&
                   player.y + player.height > obstacle.y;
        }

        function gameLoop(currentTime) {
            if (gameOver) return;

            // Update
            player.update();
            chaser.update();
            score += 0.1; // Increase score over time
            gameSpeed += 0.001; // Increased acceleration rate

            // Update road scrolling
            roadY1 += gameSpeed;
            roadY2 += gameSpeed;

            if (roadY1 >= canvas.height) {
                roadY1 = -canvas.height + (roadY1 - canvas.height); // Wrap around
            }
            if (roadY2 >= canvas.height) {
                roadY2 = -canvas.height + (roadY2 - canvas.height); // Wrap around
            }

            // Dynamically adjust obstacle spawn interval
            const currentObstacleSpawnInterval = Math.max(minObstacleSpawnInterval, 1000 - Math.floor(score / 10) * intervalReductionRate);

            // Spawn obstacles
            if (currentTime - lastObstacleSpawnTime > currentObstacleSpawnInterval && score > 25 && Math.random() < 0.18
                && !obstacles.some(o => o.y < 120)) {
                // árvore: tronco numa faixa, galho na vizinha; a terceira faixa fica livre
                const lane = Math.floor(Math.random() * 3);
                const side = lane === 0 ? 1 : lane === 2 ? -1 : (Math.random() < 0.5 ? 1 : -1);
                obstacles.push(new Tree(lane, side));
                lastObstacleSpawnTime = currentTime + 500; // um respiro depois da árvore
            } else if (currentTime - lastObstacleSpawnTime > currentObstacleSpawnInterval) {
                const availableLanes = [0, 1, 2];
                const numObstaclesToSpawn = Math.random() < (score > 100 ? 0.4 : 0.1) ? 2 : 1; // Chance to spawn 2 obstacles after score 100

                // Ensure unique lanes for multiple obstacles
                const lanesToSpawn = [];
                while (lanesToSpawn.length < numObstaclesToSpawn && availableLanes.length > 0) {
                    const randomIndex = Math.floor(Math.random() * availableLanes.length);
                    lanesToSpawn.push(availableLanes.splice(randomIndex, 1)[0]);
                }

                lanesToSpawn.forEach(lane => {
                    const randomType = Math.random() < 0.7 ? 'short' : 'tall'; // More short obstacles
                    obstacles.push(new Obstacle(lane, randomType));
                });

                lastObstacleSpawnTime = currentTime;
            }

            // Update and filter obstacles
            obstacles = obstacles.filter(obstacle => {
                obstacle.update();
                if (obstacle.type === 'tree') {
                    if (obstacle.hits(player)) { endGame(); return false; }
                    return obstacle.y < canvas.height + obstacle.height;
                }
                // Check for collision
                if (checkCollision(player, obstacle)) {
                    // If player is jumping
                    if (player.isJumping) {
                        // If it's a 'short' obstacle, the player passes over it.
                        // If it's a 'tall' obstacle, there's still a collision.
                        if (obstacle.height === 40) { // 'Short' obstacle
                            return true; // Keep obstacle, player successfully jumped over
                        } else { // 'Tall' obstacle (height 80)
                            endGame(); // Collision with tall obstacle, even when jumping
                            return false;
                        }
                    } else {
                        // If player is NOT jumping, any collision is game over.
                        endGame();
                        return false;
                    }
                }
                // Remove obstacles that are off-screen
                return obstacle.y < canvas.height + obstacle.height;
            });

            // Argolas: aparecem, andam com a pista e são pegas ao encostar no Sonic
            if (currentTime - lastRingSpawnTime > nextRingDelay) spawnRings(currentTime);
            rings.forEach(ring => {
                ring.update();
                if (!ring.collected && ringTouchesPlayer(ring)) collectRing(ring);
            });
            rings = rings.filter(r => (r.collected ? r.t < 0.45 : r.y < canvas.height + r.size));

            updateScoreDisplay();

            // Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas

            // Draw road background
            if (roadImage.complete && roadImage.naturalWidth !== 0) {
                ctx.drawImage(roadImage, 0, roadY1, canvas.width, canvas.height);
                ctx.drawImage(roadImage, 0, roadY2, canvas.width, canvas.height);
            } else {
                // Fallback: draw a solid color if road image fails to load
                ctx.fillStyle = '#66BB6A'; /* Cor de fundo do canvas */
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            obstacles.forEach(obstacle => obstacle.draw());
            rings.forEach(ring => ring.draw(currentTime));
            chaser.draw(); // o Robotnik fica atrás do Sonic
            player.draw();
            drawPopups();

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameOver = true;
            finalScoreDisplay.textContent = Math.floor(score);
            gameOverScreen.classList.remove('hidden');
            if (window.VAHRanking) window.VAHRanking.submit('fuga-do-sonic', Math.floor(score));
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('subwaySurfersHighScore', highScore);
                highScoreDisplay.textContent = `${highScore}`;
            }
        }

        restartButton.addEventListener('click', () => {
            initGame();
            requestAnimationFrame(gameLoop);
        });

        // --- Input Handling (Mobile and Desktop) ---
        let touchStartX = 0;
        let touchStartY = 0;
        let mouseIsDown = false;
        let mouseStartX = 0;
        let mouseStartY = 0;

        // Touch events for mobile
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            // Determine if it's a horizontal or vertical swipe
            if (Math.abs(dx) > Math.abs(dy)) { // Horizontal swipe (lane change)
                if (dx > 0) {
                    player.changeLane(1); // Swipe right
                } else {
                    player.changeLane(-1); // Swipe left
                }
            } else { // Vertical swipe (jump)
                if (dy < -20) { // Swiping upwards
                    player.jump(); // Trigger jump
                } else if (dy > 20) { // para baixo: rolar
                    player.roll();
                }
            }
        });

        // Mouse events for PC (simulating drag)
        canvas.addEventListener('mousedown', (e) => {
            mouseIsDown = true;
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!mouseIsDown) return; // Only process if mouse button was pressed
            mouseIsDown = false;

            const mouseEndX = e.clientX;
            const mouseEndY = e.clientY;

            const dx = mouseEndX - mouseStartX;
            const dy = mouseEndY - mouseStartY;

            // Determine if it's a horizontal or vertical drag
            if (Math.abs(dx) > Math.abs(dy)) { // Horizontal drag (lane change)
                if (dx > 0) {
                    player.changeLane(1); // Drag right
                } else {
                    player.changeLane(-1); // Drag left
                }
            } else { // Vertical drag (jump)
                if (dy < -20) { // Drag upwards
                    player.jump(); // Trigger jump
                } else if (dy > 20) { // para baixo: rolar
                    player.roll();
                }
            }
        });

        // Keyboard input for desktop (still active as alternative)
        document.addEventListener('keydown', (e) => {
            if (gameOver) return;
            switch (e.key) {
                case 'ArrowUp':
                    player.jump();
                    break;
                case 'ArrowDown':
                case 's':
                    e.preventDefault();
                    player.roll();
                    break;
                case 'ArrowLeft':
                    player.changeLane(-1);
                    break;
                case 'ArrowRight':
                    player.changeLane(1);
                    break;
            }
        });

        // Start the game when the window loads
        // Game initialization is now done after images are loaded
        // to ensure Sonic is displayed correctly.
        // If images are already loaded (e.g., on a quick reload),
        // the game will start immediately.
        if (imagesLoaded === totalImages) {
            window.onload = function() {
                initGame();
                requestAnimationFrame(gameLoop);
            };
        }
    </script>
<script src="/js/vah-ranking.js"></script>
<script>VAHRanking.button("fuga-do-sonic");</script>
</body>
