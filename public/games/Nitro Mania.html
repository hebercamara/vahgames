<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nitro Mania · VAH Games</title>
    <meta name="theme-color" content="#0C0D14">
    <link rel="icon" type="image/png" href="/images/site/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <style>
        /* Visual do VAH Games (DESIGN.md): canvas escuro, painéis translúcidos, botões em pílula, lima e violeta */
        :root { --canvas:#0C0D14; --panel:#1B1C24; --line:#292A30; --ink:#fff; --body:#E5E6EE; --muted:#BDBFCE;
                --lime:#C7FF5B; --lime-ink:#0F1A00; --violet:#A48EFF; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { font-family: Outfit, -apple-system, "Segoe UI", sans-serif; color: var(--body); overflow: hidden;
               background: var(--canvas) linear-gradient(285deg, #171D2E 20%, #3D2F73 100%) fixed;
               -webkit-tap-highlight-color: transparent; }
        button { font: inherit; }

        .game-container { height: 100dvh; max-width: 560px; margin: 0 auto; padding: 12px 16px 68px;
                          display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .top h1 { margin: 0; font-family: Unbounded, Outfit, sans-serif; font-size: clamp(16px, 4.6vw, 22px);
                  font-weight: 900; text-transform: uppercase; color: var(--ink); letter-spacing: .5px; white-space: nowrap; }
        .top-spacer { width: 44px; }
        .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
                border: 0; border-radius: 999px; font-size: 15px; font-weight: 800; cursor: pointer; text-decoration: none;
                transition: transform .12s, filter .12s, background .12s; white-space: nowrap; }
        .pill:active { transform: translateY(1px); }
        .pill-ghost { background: rgba(255,255,255,.1); color: var(--ink); }
        .pill-ghost:hover { background: rgba(255,255,255,.2); }
        .pill-lime { background: var(--lime); color: var(--lime-ink); }
        .pill-lime:hover { filter: brightness(1.05); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
        .pill:disabled { opacity: .35; cursor: not-allowed; }

        .game-info { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .game-info > span { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 16px;
                            background: rgba(255,255,255,.07); font-size: 11px; font-weight: 700; text-transform: uppercase;
                            color: var(--muted); letter-spacing: .4px; min-width: 0; }
        .game-info > span > span { font-size: 18px; font-weight: 900; color: var(--ink); letter-spacing: 0; text-transform: none; }

        /* Pista: escala para caber na altura da tela, sempre na proporção 5:6 */
        .stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { display: block;
                 border-radius: 16px; background: #2B2C33; box-shadow: 0 10px 30px rgba(0,0,0,.6); touch-action: none; }
        @media (max-width: 420px) { .hide-sm { display: none; } }
        .hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
        /* Botões de baixo na mesma linha do botão Ranking */
        .game-controls { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; gap: 8px; }
        @media (max-width: 480px) { .game-controls { left: 16px; transform: none; } }
        .nitro-btn { --p: 100%; min-width: 150px; height: 48px; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 17px; color: #2B1300;
                     background: linear-gradient(90deg, #FF9F1C var(--p), rgba(255,159,28,.25) var(--p)); }
        .nitro-btn:disabled { opacity: 1; cursor: default; color: rgba(255,255,255,.75); }
        .nitro-btn.active { color: #2B1300; animation: nitroPulse .25s infinite alternate; }
        @keyframes nitroPulse { from { filter: brightness(1); } to { filter: brightness(1.25); } }

        /* Janelas (menu, loja e mensagens): sempre cabem na tela e rolam por dentro */
        .menu-screen, .message-box { position: fixed; inset: 0; z-index: 100; display: none; align-items: center;
                                     justify-content: center; padding: 16px; background: rgba(12,13,20,.72);
                                     backdrop-filter: blur(4px); }
        .menu-screen { z-index: 101; }
        .modal { width: min(100%, 560px); max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain;
                 background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px 18px;
                 box-shadow: 0 10px 30px rgba(0,0,0,.7); display: flex; flex-direction: column; gap: 18px; text-align: center; }
        .modal h2 { margin: 0; font-family: Unbounded, Outfit, sans-serif; font-weight: 900; font-size: clamp(18px, 5vw, 24px);
                    text-transform: uppercase; color: var(--ink); line-height: 1.25; }
        .modal h3 { margin: 0 0 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
        .modal p { margin: 0; }
        .modal-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .menu-section { text-align: left; }
        #messageText { font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.35; }
        .message-box .modal { max-width: 400px; }

        #phaseButtons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        #phaseButtons button { height: 44px; border: 0; border-radius: 14px; font-weight: 900; font-size: 15px; cursor: pointer;
                               background: var(--lime); color: var(--lime-ink); }
        #phaseButtons button:hover:not(:disabled) { filter: brightness(1.06); }
        #phaseButtons button:disabled { background: rgba(255,255,255,.08); color: rgba(255,255,255,.35); cursor: not-allowed; }

        #carSelection, #carShop { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
        .car-option { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; border-radius: 16px;
                      background: rgba(255,255,255,.07); border: 2px solid transparent; cursor: pointer; transition: border-color .15s, background .15s; }
        .car-option:hover { background: rgba(255,255,255,.12); }
        .car-option.selected { border-color: var(--lime); background: rgba(199,255,91,.1); }
        .car-option.locked { opacity: .45; cursor: not-allowed; }
        .car-option img { width: 56px; height: 56px; object-fit: contain; }
        .car-option span { font-size: 12px; font-weight: 700; color: var(--body); line-height: 1.2; }
        .car-option .car-price { color: var(--lime); font-weight: 800; }
        .shop-trophies { font-size: 15px; font-weight: 700; color: var(--muted); }
        .shop-trophies b { color: var(--lime); }

        .trophy-display { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; display: none;
                          z-index: 102; animation: popIn .5s ease-out forwards; filter: drop-shadow(0 0 18px rgba(199,255,91,.6)); }
        @keyframes popIn { from { transform: translate(-50%, -50%) scale(0); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="top">
            <a class="pill pill-ghost" href="/" aria-label="Voltar ao VAH Games">← <span class="hide-sm">VAH Games</span></a>
            <h1>Nitro Mania</h1>
            <button id="menuButton" class="pill pill-ghost" type="button">Menu</button>
        </div>
        <div class="game-info">
            <span>Pontos <span id="score">0</span></span>
            <span>Fase <span id="phaseDisplay">1</span></span>
            <span>Recorde <span id="highScore">0</span></span>
            <span>Troféus <span id="trophyCount">0</span></span>
        </div>
        <div class="stage"><canvas id="gameCanvas"></canvas></div>
        <p class="hint">Toque à esquerda ou à direita da pista (ou ← →) para trocar de faixa. Nitro: botão, Espaço ou ↑.</p>
        <div class="game-controls">
            <button id="startButton" class="pill pill-lime" type="button">Iniciar jogo</button>
            <button id="nitroButton" class="pill nitro-btn" type="button" style="display: none;">🔥 Nitro</button>
        </div>
    </div>

    <!-- Mensagens (fim de jogo, fase completa, compra) -->
    <div id="messageBox" class="message-box">
        <div class="modal">
            <p id="messageText"></p>
            <div class="modal-actions">
                <button id="messageButton1" class="pill pill-lime" type="button"></button>
                <button id="messageButton2" class="pill pill-ghost" type="button"></button>
            </div>
        </div>
    </div>

    <!-- Menu inicial -->
    <div id="startMenu" class="menu-screen">
        <div class="modal">
            <h2>Nitro Mania</h2>
            <div class="menu-section">
                <h3>Escolha a fase</h3>
                <div id="phaseButtons"></div>
            </div>
            <div class="menu-section">
                <h3>Escolha seu carro</h3>
                <div id="carSelection"></div>
            </div>
            <div class="modal-actions">
                <button id="goToShopButton" class="pill pill-ghost" type="button">🏆 Loja de carros</button>
            </div>
        </div>
    </div>

    <!-- Loja de carros -->
    <div id="shopScreen" class="menu-screen">
        <div class="modal">
            <h2>Loja de carros</h2>
            <p class="shop-trophies">Você tem <b id="shopTrophies">0</b> troféus. Complete fases para ganhar mais.</p>
            <div id="carShop"></div>
            <div class="modal-actions">
                <button id="backToMenuFromShop" class="pill pill-lime" type="button">Voltar ao menu</button>
            </div>
        </div>
    </div>

    <!-- Troféu ao completar a fase -->
    <div id="trophyDisplay" class="trophy-display">🏆</div>

    <script>
        // VAH Games: progresso salvo no próprio aparelho (localStorage); o ranking é o geral do portal (vah-ranking.js).

        // Game variables
        const canvas = document.getElementById('gameCanvas');
        // Set internal resolution to match design intent
        canvas.width = 500;
        canvas.height = 600;

        // A pista ocupa todo o espaço livre: a largura interna fica em 500 e a altura cresce
        // conforme a tela (de 600 até 1000), mostrando mais estrada à frente no celular.
        function fitCanvas() {
            const stage = document.querySelector('.stage');
            const W = stage.clientWidth, H = stage.clientHeight;
            if (!W || !H) return;
            const h = Math.round(Math.max(600, Math.min(1000, 500 * H / W)));
            if (canvas.height !== h) {
                canvas.height = h;
                if (typeof playerCar !== 'undefined' && playerCar) playerCar.y = canvas.height - carHeight - 42;
            }
            const scale = Math.min(W / 500, H / canvas.height);
            canvas.style.width = Math.floor(500 * scale) + 'px';
            canvas.style.height = Math.floor(canvas.height * scale) + 'px';
        }
        let fitTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(() => { fitCanvas(); if (gameState !== 'playing') drawIdleTrack(); }, 100);
        });
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const startButton = document.getElementById('startButton');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const messageButton1 = document.getElementById('messageButton1');
        const messageButton2 = document.getElementById('messageButton2');
        const phaseDisplay = document.getElementById('phaseDisplay');
        const trophyCountDisplay = document.getElementById('trophyCount');
        const startMenu = document.getElementById('startMenu');
        const shopScreen = document.getElementById('shopScreen');
        const phaseButtonsContainer = document.getElementById('phaseButtons');
        const carSelectionContainer = document.getElementById('carSelection');
        const carShopContainer = document.getElementById('carShop');
        const goToShopButton = document.getElementById('goToShopButton');
        const backToMenuFromShopButton = document.getElementById('backToMenuFromShop');
        const trophyDisplay = document.getElementById('trophyDisplay');

        let playerCar = null;
        let opponentCars = [];
        let backgroundElements = [];
        let score = 0;
        let highScore = 0;
        let trophiesCollected = 0;
        let highestPhaseCompleted = 0;
        let gameRunning = false;
        let animationFrameId = null;
        let roadSpeed = 2;
        let opponentSpawnInterval = 3500;
        let lastOpponentSpawnTime = 0;
        let currentPhase = 1;
        let phaseStartTime = 0;
        let backgroundSpawnInterval = 500;
        let lastBackgroundSpawnTime = 0;
        let phaseDuration = 0;

        // Phase configurations
        // Fases: velocidade (px por quadro a 60 fps), intervalo entre ondas de carros, chance de a onda
        // trazer 2 carros e duração (a fase termina pela distância equivalente; o nitro chega antes).
        // Nunca mais de 2 carros por onda: sempre sobram 3 faixas livres.
        const phases = [
            { speed: 3.2, spawnInterval: 1400, pairChance: 0,    duration: 25000, trophyReward: 5 },  // Fase 1
            { speed: 3.8, spawnInterval: 1200, pairChance: 0.1,  duration: 28000, trophyReward: 7 },  // Fase 2
            { speed: 4.4, spawnInterval: 1050, pairChance: 0.25, duration: 30000, trophyReward: 10 }, // Fase 3
            { speed: 5.0, spawnInterval: 920,  pairChance: 0.35, duration: 30000, trophyReward: 12 }, // Fase 4
            { speed: 5.7, spawnInterval: 820,  pairChance: 0.45, duration: 32000, trophyReward: 15 }, // Fase 5
            { speed: 6.4, spawnInterval: 730,  pairChance: 0.55, duration: 32000, trophyReward: 18 }, // Fase 6
            { speed: 7.2, spawnInterval: 650,  pairChance: 0.65, duration: 34000, trophyReward: 20 }, // Fase 7
            { speed: 8.0, spawnInterval: 590,  pairChance: 0.72, duration: 34000, trophyReward: 25 }, // Fase 8
            { speed: 8.9, spawnInterval: 540,  pairChance: 0.8,  duration: 36000, trophyReward: 30 }, // Fase 9
            { speed: 9.8, spawnInterval: 500,  pairChance: 0.88, duration: 40000, trophyReward: 40 }, // Fase 10
        ];

        // Nitro: acelera por um tempo, dobra os pontos e depois precisa recarregar
        const NITRO_MULT = 1.75;
        const NITRO_DURATION = 2500;
        const NITRO_COOLDOWN = 6000;
        let nitroUntil = 0;
        let nitroReadyAt = 0;
        let lastFrameTime = 0;
        let frameScale = 1;
        let phaseDistance = 0;
        let phaseProgress = 0;
        let pairChance = 0;
        const nitroOn = (t = performance.now()) => t < nitroUntil;
        const effSpeed = () => roadSpeed * (nitroOn() ? NITRO_MULT : 1);

        // Car properties
        // As imagens dos carros têm 31x56 (proporção 0,55): desenhadas em 44x80 para não ficarem achatadas
        const carWidth = 44;
        const carHeight = 80;

        // All available player cars (default and shop)
        const allPlayerCars = [
            // Default cars (owned initially)
            { id: 'car_sport_red_default', name: 'Esportivo Vermelho', imageUrl: '/images/nitro-mania/Prancheta-2-c-pia-2.png', cost: 0 },
            { id: 'car_truck_blue_default', name: 'Caminhonete Azul', imageUrl: '/images/nitro-mania/Caminhonete-Azul.png', cost: 0 },
            { id: 'car_f1_yellow_default', name: 'Fórmula 1 Amarela', imageUrl: '/images/nitro-mania/F-rmula-1-amar.png', cost: 0 },

            // Shop cars (newly added)
            { id: 'car_truck_green', name: 'Caminhonete Verde', imageUrl: '/images/nitro-mania/Caminhonete-Verde.png', cost: 15 },
            { id: 'car_truck_red', name: 'Caminhonete Vermelha', imageUrl: '/images/nitro-mania/Caminhonete-Verm.png', cost: 20 },
            { id: 'car_sport_blue', name: 'Esportivo Azul', imageUrl: '/images/nitro-mania/Esporte-Azul.png', cost: 25 },
            { id: 'car_sport_orange', name: 'Esportivo Laranja', imageUrl: '/images/nitro-mania/Esporte-Laranja.png', cost: 30 },
            { id: 'car_sport_purple', name: 'Esportivo Roxo', imageUrl: '/images/nitro-mania/Esporte-Roxo.png', cost: 35 },
            { id: 'car_sport_green', name: 'Esportivo Verde', imageUrl: '/images/nitro-mania/Esporte-Verde.png', cost: 40 },
            { id: 'car_f1_purple', name: 'Fórmula 1 Roxa', imageUrl: '/images/nitro-mania/F-rmula-1-roxo.png', cost: 45 },
            { id: 'car_f1_green', name: 'Fórmula 1 Verde', imageUrl: '/images/nitro-mania/F-rmula-1-verde.png', cost: 50 },
            { id: 'car_f1_red', name: 'Fórmula 1 Vermelha', imageUrl: '/images/nitro-mania/F-rmula-1-verm.png', cost: 55 },
            { id: 'car_rocket', name: 'Foguete', imageUrl: '/images/nitro-mania/Foguete.png', cost: 100 },
            { id: 'car_superman', name: 'Superman', imageUrl: '/images/nitro-mania/Superman.png', cost: 150 }
        ];

        let ownedPlayerCarIds = ['car_sport_red_default', 'car_truck_blue_default', 'car_f1_yellow_default'];
        let selectedPlayerCarId = 'car_sport_red_default';

        // Opponent car images (only these will appear as enemies)
        const opponentCarImageUrls = [
            '/images/nitro-mania/Padr-o-Amarelo.png',
            '/images/nitro-mania/Padr-o-Azul.png',
            '/images/nitro-mania/Padr-o-Ciano.png',
            '/images/nitro-mania/Padr-o-Laranja.png',
            '/images/nitro-mania/Padr-o-rosa.png',
            '/images/nitro-mania/Padr-o-Roxo.png'
        ];

        // Road properties
        const roadLineColor = '#BDBFCE';
        const roadLineWidth = 8;
        const roadLineLength = 40;
        const roadLineGap = 60;
        let roadLineOffset = 0;

        // Grass properties
        const grassColor = '#48bb78';
        let grassOffset = 0;

        // Lane system
        const numLanes = 5;
        let lanePositions = [];
        let currentLane = Math.floor(numLanes / 2);

        // Function to calculate lane positions
        function calculateLanePositions() {
            lanePositions = [];
            const laneWidth = canvas.width / numLanes;
            for (let i = 0; i < numLanes; i++) {
                lanePositions.push(i * laneWidth + (laneWidth / 2) - (carWidth / 2));
            }
        }

        // Player Car Object
        class Car {
            constructor(x, y, imageUrl) {
                this.x = x;
                this.y = y;
                this.width = carWidth;
                this.height = carHeight;
                this.imageUrl = imageUrl;
                this.carImage = new Image();
                this.isImageLoaded = false;

                this.carImage.onload = () => {
                    this.isImageLoaded = true;
                };
                this.carImage.onerror = () => {
                    console.error(`Failed to load image: ${this.imageUrl}`);
                    this.isImageLoaded = false;
                };
                this.carImage.src = this.imageUrl;
            }

            draw() {
                const c = ctx;
                const x = this.x;
                const y = this.y;
                const w = this.width;
                const h = this.height;

                if (this.isImageLoaded) {
                    c.imageSmoothingEnabled = false;
                    c.drawImage(this.carImage, x, y, w, h);
                    c.imageSmoothingEnabled = true;
                } else {
                    // Fallback to a simple colored square if image is not loaded
                    c.fillStyle = '#63b3ed';
                    c.fillRect(x, y, w, h);
                }
            }

            update() {
                this.y += effSpeed() * frameScale;
            }
        }

        class BackgroundElement {
            constructor(x, y, width, height, type) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type;
            }

            draw() {
                const c = ctx;
                const x = this.x;
                const y = this.y;
                const w = this.width;
                const h = this.height;

                if (this.type === 'tree') {
                    c.fillStyle = '#2f855a';
                    c.fillRect(x, y, w, h * 0.7);
                    c.fillStyle = '#8b4513';
                    c.fillRect(x + w * 0.3, y + h * 0.7, w * 0.4, h * 0.3);
                } else if (this.type === 'building') {
                    c.fillStyle = '#718096';
                    c.fillRect(x, y, w, h);
                    c.fillStyle = '#cbd5e0';
                    c.fillRect(x + w * 0.1, y + h * 0.1, w * 0.2, h * 0.1);
                    c.fillRect(x + w * 0.7, y + h * 0.1, w * 0.2, h * 0.1);
                    c.fillRect(x + w * 0.1, y + h * 0.3, w * 0.2, h * 0.1);
                    c.fillRect(x + w * 0.7, y + h * 0.3, w * 0.2, h * 0.1);
                }
            }

            update() {
                this.y += effSpeed() * frameScale;
            }
        }

        function drawGrass() {
            ctx.fillStyle = grassColor;
            const roadWidth = canvas.width / numLanes * numLanes;
            const roadLeft = (canvas.width - roadWidth) / 2;
            const roadRight = roadLeft + roadWidth;

            ctx.fillRect(0, 0, roadLeft, canvas.height);
            ctx.fillRect(roadRight, 0, canvas.width - roadRight, canvas.height);

            ctx.fillStyle = '#38a169';
            for (let i = 0; i < canvas.height / 20; i++) {
                let y = (i * 20 + grassOffset) % (canvas.height + 20);
                if (y < -20) y += canvas.height + 20;

                ctx.fillRect(Math.random() * (roadLeft - 10), y, 5, 10);
                ctx.fillRect(roadRight + 5 + Math.random() * (canvas.width - roadRight - 15), y, 5, 10);
            }
            grassOffset = (grassOffset + effSpeed() * frameScale) % 20;
        }

        function drawRoad() {
            // bordas da pista
            ctx.fillStyle = '#E5E6EE';
            ctx.fillRect(0, 0, 6, canvas.height);
            ctx.fillRect(canvas.width - 6, 0, 6, canvas.height);
            ctx.fillStyle = roadLineColor;
            const period = roadLineLength + roadLineGap;
            const laneWidth = canvas.width / numLanes;
            for (let y = roadLineOffset - period; y < canvas.height; y += period) {
                for (let j = 1; j < numLanes; j++) {
                    ctx.fillRect(j * laneWidth - roadLineWidth / 2, y, roadLineWidth, roadLineLength);
                }
            }
            roadLineOffset = (roadLineOffset + effSpeed() * frameScale) % (roadLineLength + roadLineGap);
        }

        // Uma onda de 1 ou 2 carros em faixas diferentes, sem empilhar em faixa que acabou de receber carro
        function spawnOpponentCar() {
            const busy = new Set(opponentCars.filter(c => c.y < carHeight * 1.2).map(c => lanePositions.indexOf(c.x)));
            const free = [...Array(numLanes).keys()].filter(l => !busy.has(l));
            const count = Math.random() < pairChance ? 2 : 1;
            for (let k = 0; k < count && free.length; k++) {
                const lane = free.splice(Math.floor(Math.random() * free.length), 1)[0];
                const imageUrl = opponentCarImageUrls[Math.floor(Math.random() * opponentCarImageUrls.length)];
                opponentCars.push(new Car(lanePositions[lane], -carHeight - Math.random() * 30, imageUrl));
            }
        }

        function spawnBackgroundElement() {
            const side = Math.random() < 0.5 ? 'left' : 'right';
            let x;
            const y = -100;
            const type = Math.random();

            const roadLeftEdge = (canvas.width / 2) - (numLanes / 2) * (canvas.width / numLanes);
            const roadRightEdge = (canvas.width / 2) + (numLanes / 2) * (canvas.width / numLanes);

            if (side === 'left') {
                x = Math.random() * (roadLeftEdge - 20) ;
            } else {
                x = roadRightEdge + 20 + Math.random() * (canvas.width - roadRightEdge - 20 - 50);
            }

            if (type < 0.7) {
                const treeWidth = 20 + Math.random() * 15;
                const treeHeight = 40 + Math.random() * 30;
                backgroundElements.push(new BackgroundElement(x, y, treeWidth, treeHeight, 'tree'));
            } else {
                const buildingWidth = 30 + Math.random() * 40;
                const buildingHeight = 50 + Math.random() * 60;
                backgroundElements.push(new BackgroundElement(x, y, buildingWidth, buildingHeight, 'building'));
            }
        }

        function drawBackground() {
            for (let i = 0; i < backgroundElements.length; i++) {
                backgroundElements[i].draw();
            }
        }

        function updateBackgroundElements() {
            for (let i = 0; i < backgroundElements.length; i++) {
                backgroundElements[i].update();
            }
            backgroundElements = backgroundElements.filter(el => el.y < canvas.height + el.height);
        }

        // Área de batida um pouco menor que o desenho, para não "bater" no vazio
        function checkCollision(car1, car2) {
            const ix = 5, iy = 7;
            return car1.x + ix < car2.x + car2.width - ix &&
                   car1.x + car1.width - ix > car2.x + ix &&
                   car1.y + iy < car2.y + car2.height - iy &&
                   car1.y + car1.height - iy > car2.y + iy;
        }

        function drawNitroFlames(car, t) {
            const cx = car.x + car.width / 2;
            const base = car.y + car.height - 4;
            const flick = 0.75 + Math.random() * 0.5;
            [[-9, 1], [9, 1]].forEach(([dx]) => {
                ctx.fillStyle = 'rgba(255,159,28,0.95)';
                ctx.beginPath();
                ctx.moveTo(cx + dx - 6, base);
                ctx.lineTo(cx + dx + 6, base);
                ctx.lineTo(cx + dx, base + 26 * flick);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(255,240,150,0.95)';
                ctx.beginPath();
                ctx.moveTo(cx + dx - 3, base);
                ctx.lineTo(cx + dx + 3, base);
                ctx.lineTo(cx + dx, base + 13 * flick);
                ctx.closePath();
                ctx.fill();
            });
            // linhas de velocidade
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
                const lx = Math.random() * canvas.width;
                const ly = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx, ly + 40);
                ctx.stroke();
            }
        }

        function drawProgress() {
            const pct = Math.min(1, phaseProgress / phaseDistance);
            ctx.fillStyle = 'rgba(12,13,20,0.55)';
            ctx.fillRect(10, 10, canvas.width - 20, 10);
            ctx.fillStyle = nitroOn() ? '#FF9F1C' : '#C7FF5B';
            ctx.fillRect(10, 10, (canvas.width - 20) * pct, 10);
            ctx.fillStyle = '#fff';
            ctx.font = '800 14px Outfit, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('🏁', canvas.width - 12, 38);
        }

        // Botão de nitro: mostra a recarga enchendo
        function updateNitroButton(t = performance.now()) {
            const btn = document.getElementById('nitroButton');
            if (!btn) return;
            if (nitroOn(t)) {
                btn.disabled = true;
                btn.classList.add('active');
                btn.style.setProperty('--p', '100%');
                btn.textContent = '🔥 Nitro!';
            } else if (t < nitroReadyAt) {
                btn.disabled = true;
                btn.classList.remove('active');
                const pct = 100 - ((nitroReadyAt - t) / NITRO_COOLDOWN) * 100;
                btn.style.setProperty('--p', `${Math.max(0, pct)}%`);
                btn.textContent = 'Recarregando…';
            } else {
                btn.disabled = gameState !== 'playing';
                btn.classList.remove('active');
                btn.style.setProperty('--p', '100%');
                btn.textContent = '🔥 Nitro';
            }
        }

        function fireNitro() {
            const t = performance.now();
            if (gameState !== 'playing' || nitroOn(t) || t < nitroReadyAt) return;
            nitroUntil = t + NITRO_DURATION;
            nitroReadyAt = nitroUntil + NITRO_COOLDOWN;
            updateNitroButton(t);
        }

        function drawIdleTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrass();
            drawRoad();
        }

        // Game State Management
        let gameState = 'menu'; // 'menu', 'playing', 'gameOver', 'phaseComplete', 'shop'

        function showMenu() {
            gameState = 'menu';
            cancelAnimationFrame(animationFrameId);
            document.getElementById('nitroButton').style.display = 'none';
            startMenu.style.display = 'flex';
            shopScreen.style.display = 'none';
            messageBox.style.display = 'none';
            startButton.style.display = 'inline-flex';
            generatePhaseButtons();
            generateCarSelection();
        }

        function showShop() {
            gameState = 'shop';
            startMenu.style.display = 'none';
            shopScreen.style.display = 'flex';
            messageBox.style.display = 'none';
            generateCarShop();
        }

        function startGame(phaseIndex) {
            gameState = 'playing';
            cancelAnimationFrame(animationFrameId);
            startMenu.style.display = 'none';
            shopScreen.style.display = 'none';
            startButton.style.display = 'none';
            messageBox.style.display = 'none';

            currentPhase = phaseIndex + 1;
            const selectedPhase = phases[phaseIndex];
            roadSpeed = selectedPhase.speed;
            opponentSpawnInterval = selectedPhase.spawnInterval;
            phaseDuration = selectedPhase.duration;
            pairChance = selectedPhase.pairChance;
            phaseDistance = selectedPhase.speed * 60 * (selectedPhase.duration / 1000);
            phaseProgress = 0;
            nitroUntil = 0;
            nitroReadyAt = 0;
            lastFrameTime = 0;
            frameScale = 1;
            document.getElementById('nitroButton').style.display = 'inline-flex';

            score = 0;
            scoreDisplay.textContent = score;
            phaseDisplay.textContent = currentPhase;
            lastOpponentSpawnTime = 0;
            phaseStartTime = 0;
            backgroundSpawnInterval = 500;
            lastBackgroundSpawnTime = 0;
            opponentCars = [];
            backgroundElements = [];
            currentLane = Math.floor(numLanes / 2);
            const selectedCar = allPlayerCars.find(car => car.id === selectedPlayerCarId);
            playerCar = new Car(lanePositions[currentLane], canvas.height - carHeight - 42, selectedCar.imageUrl);
            gameLoop(0);
        }

        function endGame() {
            gameState = 'gameOver';
            cancelAnimationFrame(animationFrameId);
            showMessage(
                'Fim de jogo! Você fez ' + Math.floor(score) + ' pontos.',
                'Tentar de novo', () => startGame(currentPhase - 1),
                'Menu', showMenu
            );
            saveGameData();
            if (window.VAHRanking) window.VAHRanking.submit('nitro-mania', Math.floor(score));
        }

        function completePhase() {
            gameState = 'phaseComplete';
            cancelAnimationFrame(animationFrameId);
            trophiesCollected += phases[currentPhase - 1].trophyReward;
            trophyCountDisplay.textContent = trophiesCollected;

            if (currentPhase > highestPhaseCompleted) {
                highestPhaseCompleted = currentPhase;
            }
            saveGameData();

            trophyDisplay.style.display = 'block';
            setTimeout(() => {
                trophyDisplay.style.display = 'none';

                let button1Text, button1Action;
                let button2Text = 'Menu', button2Action = showMenu;

                if (currentPhase < phases.length) {
                    button1Text = `Próxima fase (${currentPhase + 1})`;
                    button1Action = () => startGame(currentPhase);
                } else {
                    button1Text = 'Voltar ao menu';
                    button1Action = showMenu;
                    button2Text = null;
                    button2Action = null;
                }
                const reward = phases[currentPhase - 1].trophyReward;
                const done = currentPhase >= phases.length ? ' Você completou todas as fases!' : '';
                showMessage(`Fase ${currentPhase} completa! +${reward} troféus 🏆${done}`, button1Text, button1Action, button2Text, button2Action);

            }, 1500);
        }

        function showMessage(text, button1Text, button1Action, button2Text = null, button2Action = null) {
            messageText.textContent = text;
            messageButton1.textContent = button1Text;
            messageButton1.onclick = button1Action;
            messageBox.style.display = 'flex';

            if (button2Text && button2Action) {
                messageButton2.style.display = 'inline-flex';
                messageButton2.textContent = button2Text;
                messageButton2.onclick = button2Action;
            } else {
                messageButton2.style.display = 'none';
            }
        }

        function hideMessageBox() {
            messageBox.style.display = 'none';
        }

        function generatePhaseButtons() {
            phaseButtonsContainer.innerHTML = '';
            phases.forEach((phase, index) => {
                const button = document.createElement('button');
                button.textContent = index + 1;
                button.setAttribute('aria-label', `Fase ${index + 1}`);
                button.dataset.phaseIndex = index;
                button.onclick = () => startGame(index);

                if (index > highestPhaseCompleted) {
                    button.disabled = true;
                }
                phaseButtonsContainer.appendChild(button);
            });
        }

        function generateCarSelection() {
            carSelectionContainer.innerHTML = '';
            allPlayerCars.filter(car => ownedPlayerCarIds.includes(car.id)).forEach((car) => {
                const carDiv = document.createElement('div');
                carDiv.className = 'car-option flex flex-col items-center cursor-pointer p-2 rounded-lg transition-all duration-200';
                if (car.id === selectedPlayerCarId) {
                    carDiv.classList.add('selected');
                } else {
                    carDiv.classList.remove('selected');
                }

                const carImage = document.createElement('img');
                carImage.src = car.imageUrl;
                carImage.alt = car.name;
                carImage.width = carWidth;
                carImage.height = carHeight;
                carImage.className = 'rounded-md';

                const carName = document.createElement('span');
                carName.textContent = car.name;
                carName.className = 'text-sm mt-1';

                carDiv.appendChild(carImage);
                carDiv.appendChild(carName);

                carDiv.onclick = () => {
                    selectedPlayerCarId = car.id;
                    localStorage.setItem('localSelectedCarId', car.id);
                    generateCarSelection();
                };

                carSelectionContainer.appendChild(carDiv);
            });
        }

        function generateCarShop() {
            document.getElementById('shopTrophies').textContent = trophiesCollected;
            carShopContainer.innerHTML = '';
            allPlayerCars.filter(car => !ownedPlayerCarIds.includes(car.id)).forEach((car) => {
                const carDiv = document.createElement('div');
                carDiv.className = 'car-option flex flex-col items-center cursor-pointer p-2 rounded-lg transition-all duration-200';

                const carImage = document.createElement('img');
                carImage.src = car.imageUrl;
                carImage.alt = car.name;
                carImage.width = carWidth;
                carImage.height = carHeight;
                carImage.className = 'rounded-md';

                const carName = document.createElement('span');
                carName.textContent = car.name;
                carName.className = 'text-sm mt-1';

                const carPrice = document.createElement('span');
                carPrice.className = 'car-price';
                carPrice.textContent = `Troféus: ${car.cost} 🏆`;

                carDiv.appendChild(carImage);
                carDiv.appendChild(carName);
                carDiv.appendChild(carPrice);

                if (trophiesCollected >= car.cost) {
                    carDiv.onclick = () => purchaseCar(car.id, car.cost);
                } else {
                    carDiv.classList.add('locked');
                }

                carShopContainer.appendChild(carDiv);
            });
            if (carShopContainer.innerHTML === '') {
                carShopContainer.innerHTML = '<p class="shop-trophies">Você já tem todos os carros!</p>';
            }
        }

        function purchaseCar(carId, cost) {
            if (trophiesCollected >= cost) {
                trophiesCollected -= cost;
                ownedPlayerCarIds.push(carId);
                trophyCountDisplay.textContent = trophiesCollected;
                saveGameData();
                generateCarSelection();
                generateCarShop();
                showMessage(`Você comprou o carro! Ele já está no menu para você escolher.`, 'Ótimo!', hideMessageBox);
            } else {
                showMessage(`Você não tem troféus suficientes para comprar este carro!`, 'Ok', hideMessageBox);
            }
        }

        // Mouse/Touch control handlers
        function handleCanvasClick(e) {
            if (gameState !== 'playing') return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            // Calculate scale factor in case canvas is resized via CSS
            const scaleX = canvas.width / rect.width;
            
            const clickX = (e.clientX - rect.left) * scaleX; // Get X relative to canvas internal resolution

            if (clickX < canvas.width / 2) { // Clicked on left half
                currentLane = Math.max(0, currentLane - 1);
            } else { // Clicked on right half
                currentLane = Math.min(numLanes - 1, currentLane + 1);
            }
        }

        // Main game loop
        function gameLoop(currentTime) {
            if (gameState !== 'playing') return;

            if (phaseStartTime === 0) {
                phaseStartTime = currentTime;
            }
            // Movimento proporcional ao tempo: a mesma velocidade em telas de 60 Hz e de 120 Hz
            frameScale = lastFrameTime > 0 && currentTime > 0 ? Math.min((currentTime - lastFrameTime) / (1000 / 60), 3) : 1;
            if (currentTime > 0) lastFrameTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrass();
            if (currentTime - lastBackgroundSpawnTime > backgroundSpawnInterval) {
                spawnBackgroundElement();
                lastBackgroundSpawnTime = currentTime;
            }
            updateBackgroundElements();
            drawBackground();
            drawRoad();

            playerCar.x = lanePositions[currentLane];
            if (nitroOn()) drawNitroFlames(playerCar, currentTime);
            playerCar.draw();

            if (currentTime - lastOpponentSpawnTime > opponentSpawnInterval) {
                spawnOpponentCar();
                lastOpponentSpawnTime = currentTime;
            }

            for (let i = 0; i < opponentCars.length; i++) {
                const car = opponentCars[i];
                car.update();
                car.draw();

                if (checkCollision(playerCar, car)) {
                    endGame();
                    return;
                }

                if (car.y > canvas.height) {
                    opponentCars.splice(i, 1);
                    i--;
                }
            }

            score += 0.1 * frameScale * (nitroOn() ? 2 : 1);
            scoreDisplay.textContent = Math.floor(score);

            phaseProgress += effSpeed() * frameScale;
            drawProgress();
            updateNitroButton();
            if (phaseProgress >= phaseDistance) {
                completePhase();
                return;
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Event Listeners for menu navigation
        startButton.addEventListener('click', showMenu);
        goToShopButton.addEventListener('click', showShop);
        backToMenuFromShopButton.addEventListener('click', showMenu);

        // Add click/touch event listener to the canvas
        // pointerdown cobre mouse e toque com um evento só (antes o toque contava duas vezes e lia a posição errada)
        canvas.addEventListener('pointerdown', handleCanvasClick);
        document.getElementById('nitroButton').addEventListener('click', fireNitro);
        document.getElementById('menuButton').addEventListener('click', () => {
            if (gameState === 'playing') {
                gameState = 'menu';
                cancelAnimationFrame(animationFrameId);
            }
            showMenu();
        });


        document.addEventListener('keydown', (e) => {
            if (gameState !== 'playing' || !playerCar) return;

            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'n' || e.key === 'N') {
                e.preventDefault();
                fireNitro();
            } else if (e.key === 'ArrowLeft') {
                currentLane = Math.max(0, currentLane - 1);
            } else if (e.key === 'ArrowRight') {
                currentLane = Math.min(numLanes - 1, currentLane + 1);
            }
        });

        loadGameData();
        fitCanvas();
        calculateLanePositions();
        drawIdleTrack();
        showMenu();

        // --- Progresso salvo no aparelho ---
        function loadGameData() {
            const num = (k) => parseInt(localStorage.getItem(k) || '0', 10) || 0;
            highScore = num('localHighScore');
            trophiesCollected = num('localTrophies');
            highestPhaseCompleted = num('localHighestPhase');
            try { ownedPlayerCarIds = JSON.parse(localStorage.getItem('localOwnedCars')) || ownedPlayerCarIds; } catch (e) {}
            selectedPlayerCarId = localStorage.getItem('localSelectedCarId') || selectedPlayerCarId;
            if (!allPlayerCars.some(c => c.id === selectedPlayerCarId)) selectedPlayerCarId = 'car_sport_red_default';
            highScoreDisplay.textContent = highScore;
            trophyCountDisplay.textContent = trophiesCollected;
        }

        function saveGameData() {
            if (Math.floor(score) > highScore) highScore = Math.floor(score);
            localStorage.setItem('localHighScore', highScore);
            localStorage.setItem('localTrophies', trophiesCollected);
            localStorage.setItem('localHighestPhase', highestPhaseCompleted);
            localStorage.setItem('localOwnedCars', JSON.stringify(ownedPlayerCarIds));
            localStorage.setItem('localSelectedCarId', selectedPlayerCarId);
            highScoreDisplay.textContent = highScore;
            trophyCountDisplay.textContent = trophiesCollected;
        }
    </script>
<script src="/js/vah-ranking.js"></script>
<script>VAHRanking.button("nitro-mania");</script>
</body>
