<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!--
      Pac-Man — baseado em mumuy/pacman de Haole Zheng (https://github.com/mumuy/pacman),
      licenciado sob MIT (veja LICENSE). Fonte Press Start 2P de CodeMan38, SIL Open Font License 1.1.
      Modificações VAH Games: página nova (sem cabeçalho/rodapé/scripts do site original e sem o
      redirecionamento para passer-by.com), textos em português, controles de toque e seta guardada por um quadro (vira na próxima curva).
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <meta name="theme-color" content="#0C0D14" />
    <title>Pac-Man · VAH Games</title>
    <meta name="description" content="Pac-Man — jogue grátis no portal VAH Games" />
    <link rel="icon" type="image/png" href="/images/site/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%}
      body{background:#0C0D14;color:#E5E6EE;font:400 14px/1.43 Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;-webkit-font-smoothing:antialiased;
        overscroll-behavior:none}
      .bar{width:100%;max-width:960px;display:flex;align-items:center;justify-content:space-between;gap:12px}
      .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:9999px;
        background:rgba(255,255,255,.1);color:#fff;font-family:inherit;font-weight:700;font-size:14px;line-height:20px;white-space:nowrap;text-decoration:none;cursor:pointer;
        transition:background .15s,opacity .15s}
      .btn:hover{background:rgba(255,255,255,.2)}
      .btn:active{opacity:.7}
      .btn:focus-visible{outline:2px solid #EFF0F7;outline-offset:2px}
      .btn-lime{background:#C7FF5B;color:#0F1A00}
      .btn-lime:hover{background:#C7FF5B;box-shadow:rgba(0,0,0,.7) 0 10px 30px}
      h1{font-weight:900;font-size:20px;text-transform:uppercase;color:#fff;white-space:nowrap}
      @media (max-width:480px){.hide-sm{display:none}}
      .stage{width:100%;max-width:960px;border-radius:16px;overflow:hidden;background:#000;border:2px solid #292A30}
      canvas{display:block;width:100%;height:auto}
      .help{color:#BDBFCE;font-size:14px;text-align:center}
      .help b{color:#fff}
      .pad{display:none;grid-template-areas:". up ." "left mid right" ". down .";grid-template-columns:repeat(3,64px);
        grid-template-rows:repeat(3,64px);gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}
      .pad button{border:0;border-radius:9999px;background:rgba(255,255,255,.1);color:#fff;font-size:22px;font-weight:800;
        font-family:inherit;touch-action:none}
      .pad button:active{background:#C7FF5B;color:#0F1A00}
      .pad .up{grid-area:up}.pad .down{grid-area:down}.pad .left{grid-area:left}.pad .right{grid-area:right}
      .pad .mid{grid-area:mid;font-size:12px}
      .touch .pad{display:grid}
      .touch .help .keys{display:none}
      .credit{color:#878A9E;font-size:12px;font-weight:700;text-align:center}
      .credit a{color:#BDBFCE}
    </style>
    <script>
      window.VAH_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      if (window.VAH_TOUCH) document.documentElement.classList.add('touch');
    </script>
</head>
<body>
    <div class="bar">
        <a class="btn" href="/">&larr; VAH Games</a>
        <h1>Pac-Man</h1>
        <button class="btn btn-lime" type="button" data-key="13">Iniciar<span class="hide-sm"> / Pausar</span></button>
    </div>

    <div class="stage">
        <canvas id="canvas" width="960" height="640">Seu navegador não suporta canvas.</canvas>
    </div>

    <p class="help"><span class="keys">Use as <b>setas</b> para andar e <b>Enter</b> ou <b>Espaço</b> para começar e pausar.</span>
        <span class="swipe">No celular, deslize sobre o jogo ou use os botões.</span></p>

    <div class="pad" aria-label="Controles">
        <button class="up" type="button" data-key="38" aria-label="Cima">&#9650;</button>
        <button class="left" type="button" data-key="37" aria-label="Esquerda">&#9664;</button>
        <button class="mid" type="button" data-key="13">OK</button>
        <button class="right" type="button" data-key="39" aria-label="Direita">&#9654;</button>
        <button class="down" type="button" data-key="40" aria-label="Baixo">&#9660;</button>
    </div>

    <p class="credit">Baseado em <a href="https://github.com/mumuy/pacman" target="_blank" rel="noopener">mumuy/pacman</a> (MIT)</p>

    <script src="./static/script/game.js"></script>
    <script src="./static/script/index.js"></script>
    <script src="/js/vah-ranking.js"></script>
    <script>VAHRanking.button("pacman");</script>
    <script>
      // Controles de toque: geram o mesmo keydown que o teclado
      (function () {
        function press(code) {
          var ev = new KeyboardEvent('keydown', { bubbles: true, cancelable: true });
          Object.defineProperty(ev, 'keyCode', { get: function () { return code; } });
          window.dispatchEvent(ev);
        }
        document.querySelectorAll('[data-key]').forEach(function (el) {
          el.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            press(parseInt(el.getAttribute('data-key'), 10));
          });
          el.addEventListener('click', function (e) { e.preventDefault(); });
        });
        // Deslizar sobre o jogo; um toque simples inicia/pausa
        var canvas = document.getElementById('canvas'), start = null;
        canvas.addEventListener('touchstart', function (e) {
          var t = e.touches[0]; start = { x: t.clientX, y: t.clientY };
        }, { passive: true });
        canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchend', function (e) {
          if (!start) return;
          var t = e.changedTouches[0], dx = t.clientX - start.x, dy = t.clientY - start.y;
          start = null;
          if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { press(13); return; }
          if (Math.abs(dx) > Math.abs(dy)) press(dx > 0 ? 39 : 37);
          else press(dy > 0 ? 40 : 38);
        });
      })();
    </script>
</body>
</html>
